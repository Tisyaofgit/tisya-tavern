if(p.mode==='welcome'){title='欢迎页助手';body=`<p>${p.assistant?'取消':'设为'} ${esc(draft.name)} 的欢迎页助手身份？</p><p class="hint">不创建用户身份，也不修改聊天内容。</p>`;save='确认';}
if(p.mode==='importChat'){title='导入会话';body=`<p>${type==='group'?'群聊支持 JSONL。':'角色支持宿主认可的 JSON/JSONL 格式。'}</p><input type="file" id="adv-chat-file" accept="${type==='group'?'.jsonl':'.json,.jsonl'}"><p class="hint">导入为新会话，不覆盖当前聊天。</p>`;save='导入';}
if(p.mode==='exportChat'){title='导出会话';body=`<label class="field"><span class="label">会话</span><select data-advanced="chat">${htmlOptions(draft.sessions.map(s=>[s.id,s.name]),v.chat)}</select></label><label class="field"><span class="label">文件格式</span><select data-advanced="format">${htmlOptions([['jsonl','JSONL 完整聊天'],['txt','TXT 纯文本']],v.format)}</select></label>`;save='导出';}
if(p.mode==='list'){title='列表与头像偏好';body=[['characters','角色列表每页'],['members','群成员每页'],['candidates','候选成员每页']].map(([k,l])=>`<label class="field"><span class="label">${l}</span><select data-advanced="${k}">${htmlOptions([5,10,25,50,100,200,500,1000].map(n=>[n,n]),v[k])}</select></label>`).join('')+`<label class="row"><input type="checkbox" data-advanced="grid" ${v.grid?'checked':''}>网格列表</label><label class="row"><input type="checkbox" data-advanced="zoom" ${v.zoom?'checked':''}>原生头像放大镜</label>${button('固定／取消固定原生抽屉','adv-drawer-pin','','small')}`;}
const panel=$('#panel-root .panel');panel.innerHTML=`<div class="panel-head"><h2>${title}</h2></div>${body}<div class="panel-actions">${button(save?'取消修改':'关闭','panel-close')}${save?button(save,'adv-save','','primary'):''}</div>`;
};
async function openAdvanced(name,chat){cleanAction();const target={type,id:selectedId,revision:draft?.revision};if(name==='urlImport'){advancedPanel('urlImport',{url:''});return}if(name==='convert'){openPanel('identity');return}if(name==='extensions'){await callHost('nativeExtras',target);return}if(name==='avatar'){advancedPanel('avatar');return}if(name==='avatarPreview'){advancedPanel('avatarPreview');return}if(name==='importChat'){advancedPanel('importChat');return}if(name==='exportChat'){advancedPanel('exportChat',{chat:chat??draft.sessions[0]?.id??'',format:'jsonl'});return}if(name==='tagManager'){const r=await callHost('tagsRead');advancedPanel('tags',{rows:r.rows.sort((a,b)=>(a.sort_order??0)-(b.sort_order??0)),sort:r.sort,folders:r.folders},{revision:r.revision,map:r.map});return}if(name==='listSettings'){advancedPanel('list',await callHost('listPrefsRead'));return}if(name==='chatLore'||name==='overrides'){const r=await callHost('chatSettingsRead',target);advancedPanel('chat',r.value,{scope:r.scope,revision:r.revision,names:r.names,chat:r.chat});return}if(name==='importTags'){advancedPanel('importTags',{names:[...new Set(String(draft.tagsText??'').split(/[,，]/).map(n=>n.trim()).filter(Boolean))]});return}const r=await callHost('advancedRead',target);if(name==='source'){let url='';try{const u=new URL(r.source);if(['http:','https:'].includes(u.protocol))url=u.href;}catch{}advancedPanel('source',{url});return}if(name==='replace'||name==='urlImport'){advancedPanel(name,{url:r.source??''});return}if(name==='embeddedLore'){if(!r.embedded)throw Error('此角色没有内嵌世界书');advancedPanel('embedded',{name:draft.name+'的世界书'});return}if(name==='welcome'){advancedPanel('welcome',{},r);return}advancedPanel('prefs',{media:r.media,styles:r.styles,spoiler:r.spoiler},{revision:r.revision,globalMedia:r.globalMedia});}
async function saveAdvanced(){const p=advancedState,v=clone(p.value),target={type,id:selectedId,revision:draft?.revision};
if(p.mode==='prefs')await callHost('prefsSave',{...target,...v,revision:p.revision});
else if(p.mode==='chat')await callHost('chatSettingsSave',{...target,value:v,scope:p.scope,revision:p.revision});
else if(p.mode==='tags')await callHost('tagsSave',{...v,revision:p.revision});
else if(p.mode==='avatar'){if(!cropImage)throw Error('先选择图片');const blob=await new Promise(r=>$('#adv-crop').toBlob(r,'image/png'));if(!blob)throw Error('图片裁切失败');await callHost('avatarSave',{...target,file:new File([blob],'avatar.png',{type:'image/png'})});avatarCache=Date.now();}
else if(p.mode==='replace')await callHost('replace',{...target,file:$('#adv-replace-file').files[0],url:v.url,confirm:selectedId});
else if(p.mode==='urlImport'){const urls=v.url.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!urls.length)throw Error('请输入网址');let result,done=0;for(const url of urls){try{const file=await callHost('urlFile',{url});result=await callHost('import',{file});done++;}catch(e){throw Error('已导入 '+done+' 项；停止于 '+url+'：'+e.message)}}closePanel();await loadHost({type:'character',id:result.id});toast('已导入 '+done+' 项');return}
else if(p.mode==='embedded')await callHost('embedded',{...target,name:v.name});
else if(p.mode==='importTags'){const next=clone(draft);next.tags=[...new Set([...next.tags,...$$('[data-import-tag]:checked').map(n=>n.dataset.importTag)])];await callHost('save',{type,draft:next});}
else if(p.mode==='welcome')await callHost('assistant',target);
else if(p.mode==='importChat')await callHost('chatImport',{...target,file:$('#adv-chat-file').files[0]});
else if(p.mode==='exportChat')await callHost('chatExport',{...target,...v});
else if(p.mode==='list')await callHost('listPrefsSave',{...v,characters:Number(v.characters),members:Number(v.members),candidates:Number(v.candidates)});
closePanel();await loadHost({type,id:selectedId});toast('操作已完成');}
function drawCrop(){if(!cropImage)return;const c=$('#adv-crop'),x=Number($('[data-crop=x]').value)/100,y=Number($('[data-crop=y]').value)/100,z=Number($('[data-crop=zoom]').value),scale=Math.max(c.width/cropImage.width,c.height/cropImage.height)*z,w=cropImage.width*scale,h=cropImage.height*scale,g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.drawImage(cropImage,(c.width-w)*x,(c.height-h)*y,w,h);}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.advanced&&advancedState){advancedState.value[el.dataset.advanced]=el.type==='checkbox'?el.checked:el.value;notify();}if(el.dataset.tagKey&&advancedState?.mode==='tags'){advancedState.value.rows[Number(el.closest('[data-tag-row]').dataset.tagRow)][el.dataset.tagKey]=el.type==='checkbox'?el.checked:el.value;notify();}if(el.dataset.crop)drawCrop();});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.advanced||el.dataset.tagKey)el.dispatchEvent(new Event('input',{bubbles:true}));if(el.id==='adv-avatar-file'){const file=el.files[0];if(!file)return;if(cropURL)URL.revokeObjectURL(cropURL);cropURL=URL.createObjectURL(file);cropImage=new Image();cropImage.onload=()=>{drawCrop();advancedState.value.image=file.name;notify()};cropImage.onerror=()=>{cropImage=null;toast('图片无法解码，请选择 PNG/JPEG/WebP')};cropImage.src=cropURL;}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.arg;const nativeNames=['avatar','avatarPreview','replace','source','embeddedLore','importTags','welcome','convert','chatLore','importChat','exportChat','extensions','tagManager','listSettings','urlImport'];if(a==='audit-route'&&v.startsWith('shared:')||a==='native'&&nativeNames.includes(v)||a==='overrides'||a==='toggle'&&['allowStyles','allowMedia','spoiler','pinned'].includes(v)||a.startsWith('adv-')||a==='restore-avatar-confirm'){e.preventDefault();e.stopImmediatePropagation();if(a==='audit-route'){closePanel();const k=v.split(':')[1],name={tags:'tagManager',layout:'listSettings',overrides:'overrides'}[k];if(k==='history'){openPanel('sessions');return}void job(()=>openAdvanced(name??'extensions')).catch(()=>{});return}if(a==='adv-bind-up'||a==='adv-bind-down'){const i=hostBindingDraft.extra.indexOf(v),j=i+(a==='adv-bind-up'?-1:1);if(j>=0&&j<hostBindingDraft.extra.length){[hostBindingDraft.extra[i],hostBindingDraft.extra[j]]=[hostBindingDraft.extra[j],hostBindingDraft.extra[i]];renderPanel();notify()}return}if(a==='adv-page'){const [key,delta]=v.split(':');pageNumber[key]=Math.max(0,(pageNumber[key]??0)+Number(delta));applyPagination();return}if(a==='adv-tag-add'){advancedState.value.rows.push({id:crypto.randomUUID(),name:'新标签',folder_type:'NONE',create_date:Date.now()});renderPanel();notify();return}if(a==='adv-tag-delete'){const i=Number(v);if(b.dataset.confirmed!=='true'){b.dataset.confirmed='true';b.textContent='确认解除并删除';return}advancedState.value.rows.splice(i,1);renderPanel();notify();return}if(a==='adv-tag-move'){const [i,d]=v.split(':').map(Number),rows=advancedState.value.rows;if(rows[i+d]){[rows[i],rows[i+d]]=[rows[i+d],rows[i]];advancedState.value.sort='manual';renderPanel();notify()}return}if(a==='adv-chat-clear'){if(b.dataset.confirmed!=='true'){b.dataset.confirmed='true';b.textContent='再次确认清空';return}advancedState.value={scenario:'',examples:'',system:'',world:''};renderPanel();notify();return}void job(async()=>{if(a==='adv-save')return saveAdvanced();if(a==='adv-drawer-pin')return callHost('drawerPin');if(a==='restore-avatar-confirm'){cleanAction();await callHost('restoreAvatar',{type,id:selectedId,revision:draft.revision});closePanel();return loadHost({type,id:selectedId})}if(a==='toggle'&&v==='pinned'){cleanAction();const result=await callHost('pin',{type,id:selectedId,before:!!draft.pinned,enabled:!draft.pinned});draft.pinned=result;current().pinned=result;return}return openAdvanced(a==='native'?v:a==='overrides'?'overrides':'prefs',b.dataset.chat);}).catch(()=>{});}},true);
const oldRenderAdvanced=render;render=function(){oldRenderAdvanced();for(const el of $$('[data-action="toggle"][data-arg="allowStyles"],[data-action="toggle"][data-arg="allowMedia"],[data-action="toggle"][data-arg="spoiler"],[data-action="toggle"][data-arg="pinned"]')){el.disabled=false;el.removeAttribute('title');}const root=$('#panel-root .panel');if(panelState?.kind==='native'&&panelState.name==='import'&&root&&!root.querySelector('[data-arg="urlImport"]'))root.insertAdjacentHTML('beforeend',button('从网址导入','native','urlImport','small'));for(const img of $$('.avatar img')){if(!img.src.includes('&t='))img.src+='&t='+avatarCache;img.onerror=()=>{img.parentElement.textContent=(img.closest('[data-member]')?char(img.closest('[data-member]').dataset.member)?.name:draft?.name)?.[0]??'◉';};}notify();};
window.addEventListener('beforeunload',e=>{if(advancedDirty()){e.preventDefault();e.returnValue=''}});
render();

const pageNumber={list:0,members:0,candidates:0};
function applyPagination(){const prefs=store.listPrefs??{};for(const [key,selector,size] of [['list','.list .entity',prefs.characters??50],['members','[data-member]',prefs.members??5],['candidates','[data-candidate-name]',prefs.candidates??5]]){let rows=$$(selector);if(key==='candidates'){const q=($('#candidate-search')?.value??'').toLowerCase();for(const r of rows)r.style.display=r.dataset.candidateName.toLowerCase().includes(q)?'':'none';rows=rows.filter(r=>r.dataset.candidateName.toLowerCase().includes(q));}const pages=Math.ceil(rows.length/size);pageNumber[key]=Math.min(pageNumber[key]??0,Math.max(0,pages-1));for(const [i,row]of rows.entries())row.style.display=Math.floor(i/size)===pageNumber[key]?'':'none';$('#pager-'+key)?.remove();if(pages>1){const nav=document.createElement('div');nav.id='pager-'+key;nav.className='row wrap';nav.style.marginTop='10px';nav.innerHTML=button('上一页','adv-page',key+':-1','small')+'<small>'+(pageNumber[key]+1)+' / '+pages+' · '+rows.length+' 项</small>'+button('下一页','adv-page',key+':1','small');rows[0].parentElement.append(nav);}}}
const paginatedRender=render;render=function(){paginatedRender();for(const el of $$('[data-action=tag]')){const t=(store.tagDefinitions??[]).find(t=>t.name===el.dataset.arg);if(t){if(t.color)el.style.backgroundColor=t.color;if(t.color2)el.style.color=t.color2;}}if(type==='group'&&draft?.avatar_url){const avatar=$('.hero .avatar');if(avatar){const img=document.createElement('img');img.src=draft.avatar_url;img.alt=draft.name;img.style.cssText='width:100%;height:100%;object-fit:cover';avatar.replaceChildren(img);}}applyPagination();};
const paginatedPanel=renderPanel;renderPanel=function(){paginatedPanel();applyPagination();};
document.addEventListener('input',e=>{if(['search','member-search','candidate-search'].includes(e.target.id)){pageNumber.list=pageNumber.members=pageNumber.candidates=0;applyPagination();}});
const sortFields={az:['name','asc'],za:['name','desc'],recent:['date_last_chat','desc'],newest:['create_date','desc'],oldest:['create_date','asc'],fav:['fav','desc'],chats:['chat_size','desc'],fewchats:['chat_size','asc'],tokens:['data_size','desc'],fewtokens:['data_size','asc'],random:['name','random']};
document.addEventListener('change',e=>{if(e.target.id!=='sort')return;e.stopImmediatePropagation();const value=e.target.value;void job(async()=>{cleanAction();const [field,order]=sortFields[value];await callHost('listSort',{field,order});sort=value;pageNumber.list=0;if(sort==='random')randomOrder=Object.fromEntries(data().map(x=>[x.id,Math.random()]));}).catch(()=>{});},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-action="grid"]');if(!b)return;e.stopImmediatePropagation();void job(async()=>{cleanAction();const prefs=await callHost('listPrefsRead');await callHost('listPrefsSave',{...prefs,grid:!grid});grid=!grid;store.listPrefs={...prefs,grid};}).catch(()=>{});},true);
const loadSorted=loadHost;loadHost=async function(target){await loadSorted(target);const p=store.listPrefs;if(p)sort=Object.entries(sortFields).find(([,s])=>s[0]===p.sortField&&s[1]===p.sortOrder)?.[0]??'recent';pageNumber.list=pageNumber.members=pageNumber.candidates=0;render();};
render();

document.addEventListener('change',e=>{if(panelState?.kind!=='lore'||!hostBindingDraft||!(e.target.id==='host-primary'||e.target.hasAttribute('data-world-extra')))return;hostBindingDraft.primary=$('#host-primary').value;const selected=$$('[data-world-extra]:checked').map(n=>n.dataset.worldExtra);hostBindingDraft.extra=[...hostBindingDraft.extra.filter(n=>selected.includes(n)),...selected.filter(n=>!hostBindingDraft.extra.includes(n))];renderPanel();notify();});
</script></body></html>
