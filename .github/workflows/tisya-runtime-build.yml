name: Temporary Tisya runtime build
on:
  push:
    paths:
      - .github/workflows/tisya-runtime-build.yml
permissions:
  contents: write
concurrency:
  group: tisya-runtime-build-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore and verify reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          git show 622cf13c3d43d62f146234b57e86584a47200133:.github/tisya-source.patch.gz.b64 > /tmp/tisya-source.patch.gz.b64
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/tisya-source.patch.gz.b64')
          s=p.read_text()
          old='truLXGl/c9wVGHQdjcmzJ5pPzm6fQ6ySUuK1cGgCAq9kPvZ5ErhgWyIa+Qp3+G0hUghrYEdQ7mH6'
