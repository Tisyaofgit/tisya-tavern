          assert s.count(old)==1, 'staged patch correction anchor is not unique'
          s=s.replace(old,new)
          if not s.endswith('\n'): s+='\n'
          p.write_text(s)
          PY
          echo '1f4c8f32eb59e1f1de76c91713f4a6e1cb6fe862d7d17bc21638343570f1a3ed  /tmp/tisya-source.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/tisya-source.patch.gz.b64 > /tmp/tisya-source.patch.gz
          gzip -dc /tmp/tisya-source.patch.gz > /tmp/tisya-source.patch
          echo 'fe825c6480657e0facd0bf47fea3bd31b360588421fec06168ba88789cead6c5  /tmp/tisya-source.patch' | sha256sum -c -
          git apply --check /tmp/tisya-source.patch
          git apply /tmp/tisya-source.patch
          rm -f /tmp/tisya-source.patch /tmp/tisya-source.patch.gz /tmp/tisya-source.patch.gz.b64
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild and verify runtime
        run: |
          npm run build:extension
          node tools/build-extension.mjs --check
      - name: Run focused regressions
        run: |
          node --test tests/form-fill-contract.test.js tests/review-visual-forms.test.js tests/turn-review-host.test.js tests/pet-review-ui.test.js tests/narrative-material-rebuild.test.js tests/release.test.js
          node --test --test-name-pattern='home lists every persisted chat' tests/shell.test.js
      - name: Commit reviewed sources and generated runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tisya-runtime-build.yml
          git add -- engine/archive.mjs engine/host.mjs engine/reply.mjs engine/review-form-document.mjs engine/review-form-ui.mjs engine/turn-review-ui.mjs layout.js manifest.json package-lock.json package.json runtime.js shell.css tables/foundation/engine.js tests/fixtures/pet-review.mjs tests/form-fill-contract.test.js tests/narrative-material-rebuild.test.js tests/pet-review-ui.test.js tests/review-visual-forms.test.js tests/turn-review-host.test.js
          git commit -m 'fix: aggregate form validation and review checks'
          git push origin main
