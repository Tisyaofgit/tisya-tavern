</style><body><header><div><div class="brand">TISYA · 月潮</div><h1 id="page-title">世界书</h1></div><span class="caption">交互样稿<br>示例数据</span></header><main class="wrap"><nav id="nav"></nav><div id="app"></div></main><div class="foot" id="foot"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const catalog=__CATALOG__;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let books=[{id:'b1',name:'北峡 · 世界设定',scope:'全局',enabled:true},{id:'b2',name:'方鹿 · 船坞与旧事',scope:'角色',enabled:true},{id:'b3',name:'旅途 · 补充设定',scope:'全局',enabled:false}];
const seed=[['b1','[世界] 北峡水系','constant',100,'北峡水道狭窄，春汛时暗流增强。渡船靠岸前须确认水位。'],['b1','[世界] 岸边旧城','constant',100,'旧城以船坞和集市为中心，街巷按水岸展开。'],['b1','[规则] 航行与天气','condition',100,'暴雨来临前，渡船暂停出航。'],['b1','[规则] 交易原则','keyword',80,'修船价格由材料与工时共同决定。'],['b1','[人物] 方鹿','keyword',100,'方鹿认真负责，不愿用漆遮盖危险的裂缝。'],['b1','[剧情] 雨夜来信','condition',35,'只有读过信的人，才知道约定的地点。'],['b2','[人物] 顾槐','keyword',100,'顾槐会要求先看检验证据，再作判断。'],['b3','[世界] 海外传闻','vector',65,'远海的灯塔有时会亮起第二盏灯。']];
let entries=seed.map((x,i)=>({uid:'e'+i,book:x[0],comment:x[1],mode:x[2],probability:x[3],content:x[4],disable:i===5,position:0,depth:4,role:0,key:i===3?'交易,修船':i===4?'方鹿,小鹿':'',keysecondary:'',selectiveLogic:0,useProbability:true,order:100-i,ruleRef:i===2?'天气.暴雨':i===5?'事件.已读来信':'',provider:'条件引擎',...Object.fromEntries(catalog.fields.filter(f=>!(f.key in {comment:1,content:1,probability:1,disable:1,position:1,depth:1,role:1,key:1,keysecondary:1,selectiveLogic:1,useProbability:1,order:1})).map(f=>[f.key,f.type==='boolean'?false:f.type.endsWith('?')?null:f.type==='array'?[]:f.type==='number'?0:'']))}));
let displaySort='custom',expandAll=false,pageSize=20;let view='entries',book='b1',selected=new Set(),query='',batchMode=false,menu=null,editing=null,draft=null,history=[],plan=null,dirty=false,auto=true,batchAction='prefix',batchScope='selected',targetField='comment',batchValue='',batchOther='',regexFlags='g',pendingDelete=null,bookEdit=null;
const modes={constant:'常驻',keyword:'关键词',condition:'条件接口',vector:'向量'};const prefix=n=>(n.match(/^\[[^\]]+\]/)||['未分组'])[0];
function remember(){history.push(JSON.stringify({books,entries}));if(history.length>30)history.shift();dirty=true;plan=null}
function undo(){if(!history.length)return;const s=JSON.parse(history.pop());books=s.books;entries=s.entries;plan=null;selected=new Set([...selected].filter(id=>entries.some(e=>e.uid===id)));dirty=history.length>0;render();say('已撤销上一步')}
function say(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),2600)}
function shown(){let a=entries.filter(e=>e.book===book&&(!query||(e.comment+'\n'+e.content).toLowerCase().includes(query.toLowerCase())));if(displaySort==='title')a.sort((a,b)=>a.comment.localeCompare(b.comment,'zh'));if(displaySort==='probability')a.sort((a,b)=>b.probability-a.probability);if(displaySort==='priority')a.sort((a,b)=>Number(a.disable)-Number(b.disable)||Number(b.mode==='constant')-Number(a.mode==='constant'));return a}
function state(e){if(e.disable)return '已关闭';if(!books.find(b=>b.id===e.book)?.enabled)return '书未启用';if(e.mode==='condition')return '条件接口待接入';return '已启用'}
function toggle(id){remember();const e=entries.find(e=>e.uid===id);e.disable=!e.disable;render()}
function groupSort(){remember();const own=entries.filter(e=>e.book===book);const groups=[...new Set(own.map(e=>prefix(e.comment)))];own.sort((a,b)=>groups.indexOf(prefix(a.comment))-groups.indexOf(prefix(b.comment)));let i=0;entries=entries.map(e=>e.book===book?own[i++]:e);render();say('同前缀已归组，组内顺序保留')}
function autogroup(id){if(!auto)return;const e=entries.find(x=>x.uid===id),g=prefix(e.comment);const others=entries.filter(x=>x.uid!==id);const last=others.map((x,i)=>x.book===e.book&&prefix(x.comment)===g?i:-1).filter(i=>i>=0).pop();if(last!==undefined){others.splice(last+1,0,e);entries=others}}
function move(id,d){const e=entries.find(e=>e.uid===id),own=entries.filter(x=>x.book===e.book);let idx=own.indexOf(e),other=own[idx+d];if(!other)return;remember();let a=entries.indexOf(e),b=entries.indexOf(other);[entries[a],entries[b]]=[entries[b],entries[a]];render()}
function switchPage(v){if(editing&&draft){say('请先保存本条或放弃修改');return}view=v;plan=null;menu=null;render();window.scrollTo(0,0)}
function edit(id){editing=id;draft=structuredClone(entries.find(e=>e.uid===id));view='editor';render();window.scrollTo(0,0)}
function newEntry(){editing='e'+Date.now();draft={uid:editing,book,comment:'[世界] 新条目',content:'',mode:'keyword',probability:100,disable:false,position:0,key:[],keysecondary:[],depth:4,role:0};view='editor';render();window.scrollTo(0,0)}
function duplicate(id){remember();let e=structuredClone(entries.find(x=>x.uid===id));e.uid='e'+Date.now();e.comment+=' 副本';entries.push(e);autogroup(e.uid);menu=null;render();say('已复制，分配了新条目身份')}
function saveEntry(){const name=$('#entry-name').value.trim();if(!name){say('请填写条目名称');return}draft.comment=name;draft.content=$('#entry-content').value;const previous=entries.find(e=>e.uid===editing);const regroup=!previous||prefix(previous.comment)!==prefix(draft.comment)||previous.book!==draft.book;remember();if(previous)entries[entries.findIndex(e=>e.uid===editing)]=draft;else entries.push(draft);if(regroup)autogroup(editing);draft=null;editing=null;view='entries';render();say('条目已保存在当前样稿中')}
function selectOne(id,on){on?selected.add(id):selected.delete(id);render()}
function entryHTML(e){return `<article class="entry ${e.disable?'off':''} ${selected.has(e.uid)?'selected':''}"><div class="row">${batchMode?`<input type="checkbox" aria-label="选择 ${esc(e.comment)}" ${selected.has(e.uid)?'checked':''} onchange="selectOne('${e.uid}',this.checked)">`:''}<div class="grow"><button class="open-title" onclick="edit('${e.uid}')"><div class="title">${esc(e.comment)}</div></button><div class="sub"><span class="pill ${e.mode==='constant'?'gold':''}">${modes[e.mode]}</span><span class="pill gray">${e.probability??100}%</span><span class="pill gray">${positionText(e)}</span></div><div class="hint" style="margin-top:7px">${state(e)}</div></div><div><button class="switch" role="switch" aria-label="启用 ${esc(e.comment)}" aria-checked="${!e.disable}" onclick="toggle('${e.uid}')"></button><div class="micro" style="text-align:center;color:var(--muted)">${e.disable?'关闭':'启用'}</div></div><button class="icon ghost" aria-label="${esc(e.comment)} 操作" onclick="menu=menu==='${e.uid}'?null:'${e.uid}';render()">⋮</button></div>${menu===e.uid?`<div class="entry-actions"><button onclick="edit('${e.uid}')">编辑</button><button onclick="duplicate('${e.uid}')">复制</button><button onclick="move('${e.uid}',-1)">上移</button><button onclick="move('${e.uid}',1)">下移</button><button onclick="pendingDelete='${e.uid}';render()" class="danger">删除</button><select aria-label="移动条目到世界书" onchange="if(this.value){remember();entries.find(e=>e.uid==='${e.uid}').book=this.value;autogroup('${e.uid}');render()}"><option value="">移到其他世界书…</option>${books.filter(b=>b.id!==e.book).map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div>`:''}${expandAll?`<div class="hint" style="white-space:pre-wrap;margin-top:12px">${esc(e.content)}</div>`:''}${pendingDelete===e.uid?`<div class="notice">删除后可撤销。<div class="flex"><button class="danger" onclick="remember();entries=entries.filter(e=>e.uid!=='${e.uid}');selected.delete('${e.uid}');pendingDelete=null;render()">删除此条</button><button onclick="pendingDelete=null;render()">取消</button></div></div>`:''}</article>`}
function positionText(e){return ({0:'角色前',1:'角色后',2:'注释前',3:'注释后',4:'深度 '+(e.depth??4),5:'示例前',6:'示例后',7:'出口'})[e.position??0]}
function entriesPage(){const b=books.find(b=>b.id===book);return `<div class="panel"><div class="row"><div class="grow"><small>${b.scope}世界书</small><h2 style="margin:4px 0">${esc(b.name)}</h2></div><button class="ghost" onclick="view='books';render()">切换</button></div><div class="hint">${entries.filter(e=>e.book===book).length} 个条目 · ${entries.filter(e=>e.book===book&&!e.disable).length} 个启用</div></div><div class="toolbar"><input id="search" type="search" placeholder="搜索名称或正文" aria-label="搜索条目" value="${esc(query)}" oninput="query=this.value;renderEntriesOnly()"><button onclick="batchMode=!batchMode;render()">${batchMode?'结束多选':'多选'}</button><button class="primary" onclick="newEntry()">＋ 新增</button></div><div class="row"><span class="hint">排布顺序 · 上方优先</span><button class="ghost" style="font-size:12px" onclick="groupSort()">按前缀归组</button></div><details><summary>列表工具</summary><div><label class="field"><span>浏览排序（不自动改注入顺序）</span><select onchange="displaySort=this.value;render()"><option value="custom" ${displaySort==='custom'?'selected':''}>自定义排布</option><option value="title" ${displaySort==='title'?'selected':''}>名称 A–Z</option><option value="probability" ${displaySort==='probability'?'selected':''}>概率从高到低</option><option value="priority" ${displaySort==='priority'?'selected':''}>常驻／普通／关闭</option></select></label><div class="flex"><button onclick="expandAll=true;render()">展开正文</button><button onclick="expandAll=false;render()">收起正文</button><button onclick="render();say('已刷新样稿列表')">刷新</button></div><p class="hint">深度、原生Order、UID、名称反序、内容长度等全部原生排序，分页、空标题回填及将浏览顺序写入Order保留在正式接线清单。</p></div></details>${batchMode?`<div class="toolbar" style="margin-top:12px"><button onclick="shown().forEach(e=>selected.add(e.uid));render()">选中筛选结果</button><button onclick="selected.clear();render()">清空</button><span class="hint">已选 ${selected.size} 条</span></div>`:''}<div id="entry-list">${shown().map(entryHTML).join('')||'<div class="panel hint">没有匹配条目。</div>'}</div><div class="notice">“上方优先”为拟定操作顺序；正式接线将同时核对扫描与最终提示词。不同注入位置仍各自在所属位置生效。</div>`}
function renderEntriesOnly(){const el=$('#entry-list');if(el)el.innerHTML=shown().map(entryHTML).join('')||'<div class="panel hint">没有匹配条目。</div>'}
function booksPage(){return `<div class="panel"><h2>世界书排布</h2><p class="hint">全局书与角色书放在同一条可排序队列中。上方先参与，点击名称管理条目。</p><div class="notice">聊天书、用户人格书仍保留原作用域；不因排序自动扩大适用范围。</div></div>${books.map((b,i)=>`<article class="entry"><div class="row"><span class="book-rank">${String(i+1).padStart(2,'0')}</span><button class="grow open-title" onclick="book='${b.id}';view='entries';query='';render()"><div class="title">${esc(b.name)}</div><div class="sub"><span class="pill">${b.scope}</span><span class="hint">${entries.filter(e=>e.book===b.id).length} 条</span></div></button><button class="switch" role="switch" aria-label="启用世界书 ${esc(b.name)}" aria-checked="${b.enabled}" onclick="remember();books.find(b=>b.id==='${b.id}').enabled=!books.find(b=>b.id==='${b.id}').enabled;render()"></button></div><div class="entry-actions"><button ${i===0?'disabled':''} onclick="remember();[books[${i-1}],books[${i}]]=[books[${i}],books[${i-1}]];render()">上移</button><button ${i===books.length-1?'disabled':''} onclick="remember();[books[${i+1}],books[${i}]]=[books[${i}],books[${i+1}]];render()">下移</button><button onclick="bookEdit=bookEdit==='${b.id}'?null:'${b.id}';render()">改名与归属</button></div>${bookEdit===b.id?`<div style="margin-top:10px"><label class="field"><span>名称</span><input value="${esc(b.name)}" onchange="if(this.value.trim()){remember();books.find(b=>b.id==='${b.id}').name=this.value.trim()}"></label><label class="field"><span>归属（样稿）</span><select onchange="remember();books.find(b=>b.id==='${b.id}').scope=this.value"><option ${b.scope==='全局'?'selected':''}>全局</option><option ${b.scope==='角色'?'selected':''}>角色</option></select></label><button onclick="bookEdit=null;render()">完成</button></div>`:''}</article>`).join('')}<div class="panel"><h2>书籍管理与绑定</h2><p class="hint">导入、导出、复制、删除、角色主书与附加书、聊天和用户人格绑定全部保留。正式版连接宿主现有数据。</p><details><summary>查看原生管理功能</summary><div>${catalog.controls.filter(c=>c.root==='WorldInfo'&&c.tag!=='input'&&c.tag!=='select').map(c=>`<div class="native-card"><b>${esc(c.label||c.id)}</b><div class="hint">列入正式接线 · 当前样稿不操作宿主</div></div>`).join('')}</div></details></div>`}
const fieldOptions={selectiveLogic:[['0','AND ANY · 辅助任一满足'],['3','AND ALL · 辅助全部满足'],['1','NOT ALL · 辅助不全满足'],['2','NOT ANY · 辅助均不满足']],position:[['0','角色定义前'],['1','角色定义后'],['5','示例消息前'],['6','示例消息后'],['2','作者注释前'],['3','作者注释后'],['4','指定深度'],['7','出口（宏引用）']],role:[['0','系统'],['1','用户'],['2','助手']]};
function fieldHTML(f){let v=draft[f.key];let key=f.key;if(fieldOptions[key])return `<label class="field"><span>${f.label}</span><select data-field="${key}" onchange="draft['${key}']=Number(this.value)">${fieldOptions[key].map(([n,t])=>`<option value="${n}" ${String(v??0)===n?'selected':''}>${t}</option>`).join('')}</select></label>`;if(f.type==='boolean')return `<label class="checkfield"><input data-field="${key}" type="checkbox" ${v?'checked':''} onchange="draft['${key}']=this.checked">${f.label}</label>`;if(f.type==='boolean?')return `<label class="field"><span>${f.label}</span><select data-field="${key}" onchange="draft['${key}']=this.value==='null'?null:this.value==='true'"><option value="null" ${v==null?'selected':''}>沿用全局</option><option value="true" ${v===true?'selected':''}>是</option><option value="false" ${v===false?'selected':''}>否</option></select></label>`;return `<label class="field"><span>${f.label}</span><input data-field="${key}" ${f.type.startsWith('number')?'type="number" min="0"':''} value="${esc(Array.isArray(v)?v.join(', '):v??'')}" placeholder="${f.type.endsWith('?')?'留空沿用／未设置':f.type==='array'?'用逗号分隔':''}" onchange="draft['${key}']=${f.type==='array'?"this.value.split(',').map(s=>s.trim()).filter(Boolean)":f.type.startsWith('number')?"this.value===''?null:Number(this.value)":"this.value"}">${key==='triggers'?'<small>normal, continue, impersonate, swipe, regenerate, quiet</small>':''}</label>`}
function editorPage(){let first=['comment','content','disable','constant','vectorized','probability'];return `<div class="row" style="margin-bottom:15px"><button class="ghost" onclick="draft=null;editing=null;view='entries';render()">‹ 放弃并返回</button><span class="hint">${esc(draft.uid)} · 条目编辑</span></div><div class="page-columns"><section><div class="panel"><div class="row" style="margin-bottom:15px"><h2 style="margin:0">基本内容</h2><label class="checkfield"><input type="checkbox" ${!draft.disable?'checked':''} onchange="draft.disable=!this.checked">启用</label></div><label class="field"><span>条目名称</span><input id="entry-name" value="${esc(draft.comment)}"></label><label class="field"><span>正文</span><textarea id="entry-content" style="min-height:280px">${esc(draft.content)}</textarea><small>保留原文与空行；正式版显示宿主 Token 计数。</small></label><label class="checkfield"><input type="checkbox" ${auto?'checked':''} onchange="auto=this.checked">保存／新建后按名称前缀自动归组</label></div><div class="panel"><h2>激活方式</h2><label class="field"><span>常驻或条件</span><select id="mode" onchange="draft.comment=$('#entry-name').value;draft.content=$('#entry-content').value;draft.mode=this.value;render()">${Object.entries(modes).map(([k,v])=>`<option value="${k}" ${draft.mode===k?'selected':''}>${k==='constant'?'常驻':'条件 · '+v}</option>`).join('')}</select></label>${draft.mode==='condition'?`<label class="field"><span>条件集合</span><input value="${esc(draft.ruleRef)}" placeholder="选择或填写条件集合" onchange="draft.ruleRef=this.value"></label><div class="notice">条件引擎待接入。接口未连接、报错或结果未知时，本条不注入。满足条件后仍检查概率、延时、互斥和预算。</div>`:draft.mode==='constant'?'<p class="hint">常驻不依赖关键词；仍遵守启用、适用范围、延时、概率与预算。</p>':draft.mode==='vector'?'<p class="hint">保留宿主向量触发能力；是否可用取决于已配置的向量服务。</p>':'<p class="hint">保留关键词、正则、辅助逻辑及全部原生匹配规则。</p>'}<label class="field" style="margin-top:14px"><span>激活概率 %</span><input id="prob" type="number" min="0" max="100" value="${draft.probability??100}" onchange="draft.probability=Math.max(0,Math.min(100,Number(this.value)));this.value=draft.probability"></label></div></section><section class="panel"><h2>完整条目设置</h2><p class="hint">常用项在前，原生细项按用途收起。</p>${[...new Set(catalog.fields.map(f=>f.section))].map(g=>`<details ${g==='注入与顺序'?'open':''}><summary>${g==='基础'?'兼容选项':g}</summary><div class="controls-grid">${catalog.fields.filter(f=>f.section===g&&!first.includes(f.key)).map(fieldHTML).join('')}</div></details>`).join('')}<div class="hint">UID和未知扩展属性原样保留；“沿用全局”不等于关闭。互斥组只控制命中选择，与名称前缀分组互不替代。</div></section></div>`}
function targets(){return entries.filter(e=>batchScope==='all'||batchScope==='selected'&&selected.has(e.uid)||batchScope==='book'&&e.book===book||batchScope==='global'&&books.find(b=>b.id===e.book).scope==='全局'||batchScope==='character'&&books.find(b=>b.id===e.book).scope==='角色')}
function batchPage(){return `<div class="stats"><div class="stat"><b>${entries.length}</b><span>全部条目</span></div><div class="stat"><b>${entries.filter(e=>!e.disable).length}</b><span>条目已启用</span></div><div class="stat"><b>${entries.filter(e=>e.mode==='condition').length}</b><span>条件接口</span></div><div class="stat"><b>${selected.size}</b><span>已选条目</span></div></div><div class="page-columns"><section class="panel"><h2>批量操作台</h2><label class="field"><span>操作范围</span><select id="batch-scope" onchange="batchScope=this.value;plan=null;render()">${[['selected','已选条目'],['book','当前世界书'],['global','全局世界书'],['character','角色世界书'],['all','全部世界书']].map(([k,t])=>`<option value="${k}" ${batchScope===k?'selected':''}>${t}</option>`).join('')}</select><small>${targets().length} 个目标；包含范围内已关闭的条目。</small></label><label class="field"><span>操作</span><select id="batch-action" onchange="batchAction=this.value;batchValue='';batchOther='';plan=null;render()">${[['prefix','增加前缀'],['suffix','增加后缀'],['prefixReplace','替换前缀'],['suffixReplace','替换后缀'],['replace','正则检索与替换'],['probability','统一激活概率'],['mode','统一触发方式'],['enabled','统一启用状态']].map(([k,t])=>`<option value="${k}" ${batchAction===k?'selected':''}>${t}</option>`).join('')}</select></label>${['prefix','suffix','prefixReplace','suffixReplace','replace'].includes(batchAction)?`<label class="field"><span>修改字段</span><select id="target-field" onchange="targetField=this.value;plan=null">${[['comment','条目名称'],['content','正文'],['key','主要关键词'],['keysecondary','辅助关键词']].map(([k,t])=>`<option value="${k}" ${targetField===k?'selected':''}>${t}</option>`).join('')}</select></label>`:''}${batchAction==='mode'?`<select id="batch-value" onchange="batchValue=this.value;plan=null"><option value="">请选择</option>${Object.entries(modes).map(([k,v])=>`<option value="${k}" ${batchValue===k?'selected':''}>${v}</option>`).join('')}</select>`:batchAction==='enabled'?'<select id="batch-value" onchange="batchValue=this.value;plan=null"><option value="">请选择</option><option value="true">启用</option><option value="false">关闭</option></select>':`<label class="field"><span>${batchAction==='replace'?'正则表达式（不含两端斜杠）':batchAction.endsWith('Replace')?'原前／后缀':batchAction==='probability'?'概率 0–100':'添加内容'}</span><input id="batch-value" value="${esc(batchValue)}" ${batchAction==='probability'?'type="number" min="0" max="100"':''} placeholder="${batchAction==='replace'?'例如：^\\[世界\\]':batchAction==='probability'?'100':'例如：[北峡] '}" oninput="batchValue=this.value;plan=null"></label>`}${batchAction==='replace'||batchAction.endsWith('Replace')?`<label class="field"><span>替换为 ${batchAction==='replace'?'（支持 $1 捕获组）':''}</span><input id="batch-other" value="${esc(batchOther)}" oninput="batchOther=this.value;plan=null"></label>`:''}${batchAction==='replace'?`<label class="field"><span>正则标志</span><select id="regex-flags" onchange="regexFlags=this.value;plan=null"><option value="g">g · 全部匹配</option><option value="gi">gi · 忽略大小写</option><option value="gm">gm · 多行</option><option value="gim">gim · 多行、忽略大小写</option></select></label>`:''}<button class="primary" style="width:100%;margin-top:14px" onclick="makePlan()">检索并预览修改</button><div id="batch-error" class="error hint" role="alert"></div></section><section class="panel"><h2>修改预览</h2><div id="diffs">${plan?planHTML():'<p class="hint">先确定范围，再显示逐条修改前后内容。检查后一次应用，可撤销。</p><div class="notice">自动归组只按名称前缀整理，不修改条目正文，不把展示分组变成互斥组。</div>'}</div></section></div>`}
function planHTML(){return `<p class="hint">范围 ${plan.total} 条 · 实际修改 ${plan.rows.length} 条</p>${plan.rows.map(r=>`<div class="diff"><b>${esc(r.name)}</b><div class="old">− ${esc(r.before)}</div><div class="new">＋ ${esc(r.after)}</div></div>`).join('')||'<p class="hint">没有需要修改的内容。</p>'}<button class="primary" style="width:100%;margin-top:14px" ${!plan.rows.length?'disabled':''} onclick="applyPlan()">应用 ${plan.rows.length} 项修改</button>`}
async function regexTransform(values,pattern,replacement,flags){const code=`onmessage=e=>{try{let r=new RegExp(e.data.pattern,e.data.flags);postMessage({values:e.data.values.map(v=>v.replace(r,e.data.replacement))})}catch(x){postMessage({error:x.message})}}`;const url=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));return new Promise((resolve,reject)=>{let worker;try{worker=new Worker(url)}catch(e){URL.revokeObjectURL(url);reject(new Error('当前打开方式不支持安全正则预览，请用浏览器打开样稿'));return}let timer=setTimeout(()=>{worker.terminate();URL.revokeObjectURL(url);reject(new Error('正则计算超时，未修改任何条目'))},700);worker.onmessage=e=>{clearTimeout(timer);worker.terminate();URL.revokeObjectURL(url);e.data.error?reject(new Error(e.data.error)):resolve(e.data.values)};worker.onerror=e=>{clearTimeout(timer);worker.terminate();URL.revokeObjectURL(url);reject(new Error(e.message))};worker.postMessage({values,pattern,replacement,flags})})}
async function makePlan(){const candidates=structuredClone(targets()),act=batchAction,value=batchValue,other=batchOther,field=['mode','probability','enabled'].includes(act)?act==='enabled'?'disable':act:targetField;plan=null;const err=$('#batch-error');err.textContent='';try{if(!candidates.length)throw Error('请先选择条目，或更改操作范围');if(!value)throw Error('请填写操作内容');if(act==='probability'&&(!Number.isFinite(Number(value))||+value<0||+value>100))throw Error('概率必须在 0–100 之间');let before=candidates.map(e=>String(e[field]??''));let after;const requestSignature=JSON.stringify({view,batchScope,batchAction,targetField,batchValue,batchOther,regexFlags,selected:[...selected],entries});if(act==='replace'){const flat=candidates.flatMap(e=>Array.isArray(e[field])?e[field]:[String(e[field]??'')]);const result=await regexTransform(flat,value,other,regexFlags);let n=0;after=candidates.map(e=>Array.isArray(e[field])?e[field].map(()=>result[n++]):result[n++]);if(requestSignature!==JSON.stringify({view,batchScope,batchAction,targetField,batchValue,batchOther,regexFlags,selected:[...selected],entries})){say('操作条件已变化，请重新预览');return}}else {const transform=v=>act==='prefix'?v.startsWith(value)?v:value+v:act==='suffix'?v.endsWith(value)?v:v+value:act==='prefixReplace'?v.startsWith(value)?other+v.slice(value.length):v:act==='suffixReplace'?v.endsWith(value)?v.slice(0,-value.length)+other:v:act==='probability'?Number(value):act==='enabled'?value==='false':value;after=candidates.map((e,i)=>Array.isArray(e[field])?e[field].map(v=>transform(String(v))):transform(before[i]));}plan={snapshot:JSON.stringify(entries),total:candidates.length,field,rows:candidates.map((e,i)=>({uid:e.uid,name:e.comment,before:e[field]??'',after:after[i]})).filter(r=>JSON.stringify(r.before)!==JSON.stringify(r.after))};$('#diffs').innerHTML=planHTML()}catch(e){err.textContent=e.message;$('#diffs').innerHTML='<p class="hint">没有应用任何修改。</p>'}}
function applyPlan(){if(!plan||plan.snapshot!==JSON.stringify(entries)){say('内容已变化，请重新预览');plan=null;return}const p=plan;remember();p.rows.forEach(r=>{const e=entries.find(e=>e.uid===r.uid);e[p.field]=structuredClone(r.after);if(p.field==='comment')autogroup(e.uid)});render();say('已应用 '+p.rows.length+' 项，可撤销')}
function globalPage(){const controls=catalog.controls.filter(c=>c.root==='WorldInfo'&&c.id.startsWith('world_info_')&&!c.id.endsWith('_counter')&&['input','select'].includes(c.tag)&&!['world_info_sort_order','world_info_search'].includes(c.id));return `<div class="panel"><h2>全局扫描与预算</h2><p class="hint">完整保留宿主设置；此页只演示控件布局，尚未写入宿主。</p>${controls.map(c=>`<label class="field"><span>${esc(globalLabel(c.id))}</span>${c.options.length?`<select>${c.options.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</select>`:c.type==='checkbox'?'<input type="checkbox">':'<input type="number" min="0" placeholder="沿用宿主当前值">'}</label>`).join('')}<details><summary>原生能力核对结果</summary><div><p>${catalog.counts.controls} 个DOM控件，${catalog.counts.fields} 个默认字段；包括隐藏兼容项与重复输入。</p><p class="hint">已核HTML和JS处理路径，尚未做宿主接线及Android验收。额外来源、生成类型、向量触发、出口与自动化均保留。</p></div></details></div>`}
function globalLabel(k){return ({world_info_depth:'扫描深度',world_info_budget:'上下文预算百分比',world_info_budget_cap:'预算上限',world_info_min_activations:'最少激活条目',world_info_min_activations_depth_max:'最少激活的最大扫描深度',world_info_max_recursion_steps:'最大递归次数',world_info_character_strategy:'原生角色／全局优先策略',world_info_include_names:'扫描时包含名字',world_info_recursive:'递归扫描',world_info_case_sensitive:'区分大小写',world_info_match_whole_words:'全词匹配',world_info_use_group_scoring:'互斥组评分',world_info_overflow_alert:'预算溢出提醒'})[k]||k}
function render(){const tabs=[['books','世界书'],['entries','条目'],['batch','操作台'],['global','全局设置']];$('#nav').innerHTML=tabs.map(([k,v])=>`<button class="${view===k?'active':''}" onclick="switchPage('${k}')">${v}</button>`).join('');$('#page-title').textContent=view==='editor'?'编辑条目':view==='batch'?'世界书操作台':'世界书';$('#app').innerHTML=view==='books'?booksPage():view==='editor'?editorPage():view==='batch'?batchPage():view==='global'?globalPage():entriesPage();$('#foot').innerHTML=view==='editor'?`<button onclick="draft=null;editing=null;view='entries';render()">放弃修改</button><button class="primary" onclick="saveEntry()">保存条目</button>`:`<button ${!history.length?'disabled':''} onclick="undo()">撤销</button>${view==='entries'?`<button class="primary" onclick="view='batch';batchScope=selected.size?'selected':'book';render()">${selected.size?'批量处理 '+selected.size+' 条':'打开操作台'}</button>`:`<button class="primary" onclick="say('当前为独立样稿，修改仅保留在本次打开期间')">${dirty?'修改在样稿中':'示例数据'}</button>`}`}
render();
</script></body></html>
