<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#164838,#061e19 70%);color:#eadfbd;font:16px/1.8 Georgia,serif}button,textarea{font:inherit;color:inherit;background:#1b4237;border:1px solid #a99564;border-radius:10px;padding:8px 12px;min-height:44px}header{height:48px;padding:9px 18px;border-bottom:1px solid #bca47455}#chat{position:fixed;inset:48px 0 148px;overflow:auto;padding:20px}#chat>article{max-width:680px;margin:auto}.controls{display:flex;flex-wrap:wrap;gap:6px}.controls button{font-size:12px;padding:5px 8px}h1{font-size:23px;font-weight:400}#send_form{position:fixed;bottom:0;left:8px;right:8px;min-height:140px;padding:12px;border:1px solid #ccb779;border-radius:18px;background:linear-gradient(145deg,#315246,#092720);z-index:70}nav{display:flex;gap:5px;margin-bottom:12px}nav span{flex:1;text-align:center;font-size:13px;border:1px solid #c3b87b66;border-radius:9px;padding:5px}#entry{display:flex;gap:8px}#send_textarea{width:0;flex:1;resize:none;min-height:48px}#send_but{flex:none;min-width:64px;background:#b8aa72;color:#142b23}.tall-composer #send_form{height:260px}.tall-composer #chat{bottom:268px}.tall-composer #send_textarea{height:166px}#errors{color:#ffb2a0;white-space:pre-wrap}#geometry{font:11px/1.4 monospace;white-space:pre-wrap}#send-result{display:block;min-height:50px;color:#e6d18e}.story{min-height:280px;border:1px solid #baa77766;border-radius:20px;padding:20px;margin-top:18px;background:#173a2b99}</style>
<header>缇斯亚 · 月潮 <small>PRV-2 / 正式桌宠与确认组件</small></header><main id="chat"><article><h1>气泡跟着缇斯亚，发送留给你。</h1><div class="controls"><button id="hide-pet">收拢桌宠</button><button id="show-pet">展开桌宠</button><button id="fold-phone">展开小手机</button><button id="expand-phone">完整手机</button><button id="new-candidate">新增待确认</button><button id="tall-composer">切换多行输入</button><button id="empty-chat">切换空会话</button><button id="restore-chat">恢复会话</button><button id="measure">检查布局</button></div><output id="send-result">发送测试只在此页计数，不调用模型。</output><p class="story">信已交给船夫，渡口的风吹散了雨。<br><br>你把剩下的话留在掌心，等下一次潮来。<br><br>核验入口会随桌宠一起移动；收拢后停在右侧。<br><br>这是独立测试页面，使用合成候选。</p><pre id="geometry"></pre><p id="errors" role="alert"></p></article></main><form id="send_form"><nav><span>要求</span><span>手机</span><span>聊天</span><span>扩展</span><span>更多</span></nav><div id="entry"><textarea id="send_textarea" aria-label="输入消息" placeholder="输入想发送的消息…"></textarea><button id="send_but" type="submit">发送</button></div></form><script type="module" src="./pet-review.bundle.js"></script></html>
