<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>缇斯亚 · 资料层与格式封印验收</title><style>body{margin:28px auto;max-width:1000px;padding:0 18px;background:#09231d;color:#eee3c8;font:16px/1.7 system-ui}select,textarea,button{font:inherit;background:#143d31;color:inherit;border:1px solid #c4ab6880;padding:8px;margin:8px 0;border-radius:7px}textarea{display:block;width:95%}pre{white-space:pre-wrap;overflow-wrap:anywhere}#status{padding:16px;background:#164332}label{display:block}small{color:#b9c6b8}</style><h1>资料归位与最终格式封印</h1><small id="build"></small><p>隔离验收页：使用固定宿主装配片段和本次生产模块，验证最终请求。</p><label>叙述人称 <select id="person"><option value="N02-A">第三人称</option><option value="N02-B">第一人称</option><option value="N02-C" selected>第二人称（你）</option><option value="N02-D">角色我 × 主控你</option></select></label><label>心声 <select id="voice"><option value="S08-MindVoice-C">心声与表面反差</option><option value="S08-MindVoice-B">第一人称心声</option></select></label><label><input id="dialogue" type="checkbox" checked> 启用实名对白框</label><label><input id="thought" type="checkbox" checked> 启用署名心声块</label><label>合成用户历史<textarea id="history">我在门边等候。</textarea></label><button id="run">装配并核对最终请求</button><p id="status">等待操作</p><pre id="summary"></pre><details><summary>完整合成请求</summary><pre id="payload"></pre></details></html>
