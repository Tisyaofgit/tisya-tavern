<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>缇斯亚发送历史回归</title><style>
*{box-sizing:border-box}body{font:15px/1.65 system-ui,sans-serif;margin:0;background:#eef4f0;color:#16372a}main{max-width:780px;margin:auto;padding:20px}h1{font-size:22px}section{background:white;border:1px solid #b4c7bc;border-radius:12px;padding:16px;margin:14px 0}textarea{width:100%;min-height:100px;font:inherit;padding:10px}button{font:inherit;padding:9px 12px;margin:5px 5px 5px 0;border:1px solid #587e69;border-radius:7px;background:#e4efe8;color:#16372a;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;font-size:13px}#error{color:#a42424}label{display:block}details{margin:12px 0}
</style></head><body><main><h1>发送前历史检查</h1><p id="version"></p><p>隔离合成数据 · 使用正式发送准备与最终载荷服务 · 不调用模型</p><section><label for="input">本轮输入</label><textarea id="input"></textarea><button id="send">检查并准备发送</button><button id="reload">重新打开</button></section><section><h2>检查结果</h2><p id="error" role="alert"></p><pre id="result"></pre></section><section><button id="broken">放入坏协议历史</button><button id="restore">恢复旧HTML历史</button><details open><summary>第一层原始历史</summary><pre id="source"></pre></details><details><summary>实际组装的完整请求</summary><pre id="payload"></pre></details></section></main><script type="module" src="./history-send.bundle.js"></script></body></html>
