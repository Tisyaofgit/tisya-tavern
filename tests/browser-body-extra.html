<body class="tisya-active">

<script type="module">

const liveBody=nativeHTML('正文'),liveExtra=nativeHTML('extra'),fence=html=>'```html\n'+html+'\n```';
const rules=[['信笺','LETTER_TOKEN','〔信笺：河畔来信〕纸上有一行问候。〔/信笺〕'],['正文静态卡','STATIC_BODY_TOKEN',fence(staticHTML)],['extra 静态卡','EXTRA_STATIC_TOKEN',fence(extraHTML)],['正文原生卡','LIVE_BODY_TOKEN',fence(liveBody)],['extra 原生卡','LIVE_EXTRA_TOKEN',fence(liveExtra)]].map(([scriptName,token,replaceString])=>({scriptName,findRegex:'/'+token+'/g',replaceString,markdownOnly:true,placement:[2]}));

const stage=document.querySelector('#stage'),chat=document.querySelector('#chat'),status=document.querySelector('#state'),reportNode=document.querySelector('#report'),errorList=document.querySelector('#error-list');

function recordError(error){const value={name:error?.name??'Error',message:error?.message??String(error),stack:error?.stack??null};errors.push(value);const li=document.createElement('li');li.textContent=value.message;errorList.append(li);}

async function mount(next=mode){

 await until(()=>all(chat,'iframe[data-tisya-body-document]').some(frame=>frame.contentDocument?.querySelector('.static-note')),'正文静态 iframe 未就绪');

 await delay(80);window.fixture.ready=true;return current;
}
function metrics(){

 const letter=all(chat,'[data-tisya-mark="信笺"]')[0],text=visibleText(chat),bodyHost=bodyFrame?.parentElement;

 const sequence=++runSequence;document.querySelector('#check-current').disabled=true;window.fixture.lastReport=null;

  if(worldButton().getAttribute('aria-expanded')!=='true'){worldButton().click();await delay(120);}
  const bodyFrame=all(chat,'iframe[data-tisya-body-document]')[0],bodyRealm=bodyFrame.contentWindow,bodyDocument=bodyFrame.contentDocument,extraFrame=all(chat,'iframe[data-tisya-extra-document]').find(frame=>frame.contentDocument?.querySelector('.extra-note')),compilations=current.compilations();
