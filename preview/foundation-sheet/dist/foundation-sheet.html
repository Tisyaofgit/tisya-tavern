</style></head><body><main></main><script>const catalog={"version":"FT21","templates":[{"id":"core","layer":"基点","label":"基点","table":"core-draft","groups":["核心"],"fields":[{"key":"核心与不可替代性","label":"核心与不可替代性","path":["essence"],"group":"核心","definition":{"type":"text","description":"去掉世界外壳后必须保留什么；不要只提取标签。"}},{"key":"价值与选择","label":"价值与选择","path":["choice"],"group":"核心","definition":{"type":"text","description":"价值冲突、判断及拒绝边界，有原文才保留。"}},{"key":"愿望与形成因果","label":"愿望与形成因果","path":["motive"],"group":"核心","definition":{"type":"text","description":"这里只保留经历如何形成或改变核心的依据；欲望本身归欲望双螺旋，不重复抄写，不复制旧世界人名和已完成事件。"}},{"key":"用途、能力与代价","label":"用途、能力与代价","path":["ability"],"group":"核心","definition":{"type":"text","description":"能力/物品用途的意义、限制与代价；数值另由目标世界定义。"}},{"key":"辨识与象征","label":"辨识与象征","path":["anchor"],"group":"核心","definition":{"type":"text","description":"只有核心必需的外形/象征才保留；其余允许世界化。"}},{"key":"选择携带的成长","label":"选择携带的成长","path":["growth"],"group":"核心","definition":{"type":"text","description":"仅用户明确选择；作为待适配的经历意义，不冒充新会话已经发生。"}},{"key":"所选对象的关联意义","label":"所选对象的关联意义","path":["links"],"group":"核心","definition":{"type":"text","description":"对象齐全且明确选择才保留；不自动扩大选取或携带旧关系、背包。"}},{"key":"性格核心标签","label":"性格核心标签","path":["personality-tags"],"group":"核心","definition":{"type":"text","description":"人物核心的少量辨识词；与欲望、矛盾共同保留，不以同标签替换其具体意义。"}},{"key":"欲望双螺旋","label":"欲望双螺旋","path":["desire-axis"],"group":"核心","definition":{"type":"text","description":"保留多股同时成立的核心欲望及优先关系，不简化为目标对障碍；原点分别映射具体表达，不复制旧任务进度。"}},{"key":"核心矛盾","label":"核心矛盾","path":["tension-axis"],"group":"核心","definition":{"type":"text","description":"保留多股欲望的冲突、依赖与强化，以及它们与信念、恐惧、现实限制的拉扯和取舍代价；不强造创伤或预设成长。"}},{"key":"面具及真实落差","label":"面具及真实落差","path":["persona-mask"],"group":"核心","definition":{"type":"text","description":"有依据才携带表层呈现的用途及与真实反应的落差；核心意义适配到原点面具层，旧世界场合、人名和已揭露状态不直接迁移。"}}]},{"id":"origin.character","layer":"原点","label":"人物","table":"objects","kind":"character","groups":["身份","形貌","性情","生活","表达","本领","核心","面具"],"fields":[{"key":"名称","label":"名称","path":["名称"],"group":"身份","definition":{"type":"text","required":true,"capture":"identity","include":{"op":"selected"}}},{"key":"别名","label":"别名","path":["别名"],"group":"身份","definition":{"type":"texts","capture":"identity","include":{"op":"selected"}}},{"key":"身份细目·物种","label":"物种","path":["属性","身份细目","物种"],"group":"身份","definition":{"type":"refs","description":"已登记物种定义的稳定引用；未知不补人类。"}},{"key":"身份细目·生命阶段","label":"生命阶段","path":["属性","身份细目","生命阶段"],"group":"身份","definition":{"type":"text","description":"按世界物种和历法表述；不把现实年龄默认给人物。"}},{"key":"身份细目·出生时期","label":"出生时期","path":["属性","身份细目","出生时期"],"group":"身份","definition":{"type":"text","description":"有来源的世界时间表达；不强制公历日期。"}},{"key":"身份细目·出身地","label":"出身地","path":["属性","身份细目","出身地"],"group":"身份","definition":{"type":"refs","description":"出生/成长来源地，不是当前位置。"}},{"key":"身份细目·语言","label":"语言","path":["属性","身份细目","语言"],"group":"身份","definition":{"type":"texts","description":"已确认可用语言；不因此自动懂秘密或暗语。"}},{"key":"身份细目·社会身份","label":"社会身份","path":["属性","身份细目","社会身份"],"group":"身份","definition":{"type":"text","description":"原点的社会位置、责任与限制；当前任职另由状态/关系维护。"}},{"key":"形貌·整体","label":"整体","path":["属性","形貌","整体"],"group":"形貌","definition":{"type":"text","description":"原点稳定体貌。"}},{"key":"形貌·辨识特征","label":"辨识特征","path":["属性","形貌","辨识特征"],"group":"形貌","definition":{"type":"texts","description":"有依据的独特外观锚点。"}},{"key":"形貌·仪态","label":"仪态","path":["属性","形貌","仪态"],"group":"形貌","definition":{"type":"text","description":"已确立的惯常动作、姿态和身体表达；语速归节奏，单次动作不算惯常。"}},{"key":"形貌·惯常装束","label":"惯常装束","path":["属性","形貌","惯常装束"],"group":"形貌","definition":{"type":"text","description":"衣着习惯，非当前穿戴或库存。"}},{"key":"形貌·感官印象","label":"感官印象","path":["属性","形貌","感官印象"],"group":"形貌","definition":{"type":"text","description":"可感知的稳定印象，不给观察者无依据的秘密知识。"}},{"key":"性情·价值取舍","label":"价值取舍","path":["属性","性情","价值取舍"],"group":"性情","definition":{"type":"text","description":"选择之间的优先与代价。"}},{"key":"性情·判断方式","label":"判断方式","path":["属性","性情","判断方式"],"group":"性情","definition":{"type":"text","description":"形成判断、核验证据和处理分歧的方法；具体操作流程归做事方式。"}},{"key":"性情·情绪处理","label":"情绪处理","path":["属性","性情","情绪处理"],"group":"性情","definition":{"type":"text","description":"稳定应对方式，非当前心情。"}},{"key":"性情·长处","label":"长处","path":["属性","性情","长处"],"group":"性情","definition":{"type":"texts","description":"性情上的优点及具体表现；技艺归擅长。"}},{"key":"性情·短处","label":"短处","path":["属性","性情","短处"],"group":"性情","definition":{"type":"texts","description":"性情上的弱点及后果；未掌握技能归不足，伤势限制归代价限制。"}},{"key":"性情·拒绝边界","label":"拒绝边界","path":["属性","性情","拒绝边界"],"group":"性情","definition":{"type":"text","description":"已确立的稳定拒绝原则；单次拒绝、未答应或尚未发生不构成原则。"}},{"key":"性情·协商条件","label":"协商条件","path":["属性","性情","协商条件"],"group":"性情","definition":{"type":"text","description":"哪些新依据可能改变决定。"}},{"key":"性情·改变条件","label":"改变条件","path":["属性","性情","改变条件"],"group":"性情","definition":{"type":"text","description":"材料明确说明的可能促成性情变化的条件；期待、尚未改变不算条件，未说明留空。"}},{"key":"生活·生计","label":"生计","path":["属性","生活","生计"],"group":"生活","definition":{"type":"text","description":"日常谋生方式。"}},{"key":"生活·作息","label":"作息","path":["属性","生活","作息"],"group":"生活","definition":{"type":"text","description":"日常起居、工作和休息的时间安排；反复小动作归习惯。"}},{"key":"生活·兴趣","label":"兴趣","path":["属性","生活","兴趣"],"group":"生活","definition":{"type":"texts","description":"稳定兴趣；单次行为不能自动确立。"}},{"key":"生活·习惯","label":"习惯","path":["属性","生活","习惯"],"group":"生活","definition":{"type":"texts","description":"已确认的日常反复行为；不复抄作息时间或性情判断原则。"}},{"key":"生活·长期目标","label":"长期目标","path":["属性","生活","长期目标"],"group":"生活","definition":{"type":"text","description":"长期自主愿望及已知进展；不改成已成功或已接受的任务。"}},{"key":"生活·社会责任","label":"社会责任","path":["属性","生活","社会责任"],"group":"生活","definition":{"type":"text","description":"稳定承担的职责范围；对象间持续联系另见关系，不复抄互动经过。"}},{"key":"表达·措辞","label":"措辞","path":["属性","表达","措辞"],"group":"表达","definition":{"type":"text","description":"用词、比喻和话题选择；语速、长短及讲述次序归节奏。"}},{"key":"表达·节奏","label":"节奏","path":["属性","表达","节奏"],"group":"表达","definition":{"type":"text","description":"句式与表达节奏。"}},{"key":"表达·幽默","label":"幽默","path":["属性","表达
