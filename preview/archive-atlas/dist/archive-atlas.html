:root{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:oklch(.925 .015 240);color:oklch(.22 .01 260);font-family:"Helvetica Neue","TisyaReading","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.42}
button:focus:not(:focus-visible){outline:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#app{--primitive-bg:oklch(.925 .015 240);--primitive-paper:oklch(.965 .008 240);--primitive-ink:oklch(.22 .01 260);--primitive-muted:oklch(.48 .025 240);--primitive-line:oklch(.78 .025 240);--primitive-accent:oklch(.40 .055 240);--primitive-soft:oklch(.885 .025 240);--bg:var(--primitive-bg);--paper:var(--primitive-paper);--ink:var(--primitive-ink);--muted:var(--primitive-muted);--line:var(--primitive-line);--accent:var(--primitive-accent);--soft:var(--primitive-soft);background:var(--bg);color:var(--ink);min-height:100dvh;font-size:16px;line-height:1.65;transition:background-color .2s ease-out,color .2s ease-out}
#app[data-theme=dark]{--primitive-bg:oklch(.17 .015 275);--primitive-paper:oklch(.215 .018 265);--primitive-ink:oklch(.92 .01 240);--primitive-muted:oklch(.76 .025 240);--primitive-line:oklch(.38 .025 250);--primitive-accent:oklch(.78 .07 230);--primitive-soft:oklch(.26 .03 250);color-scheme:dark}
.topbar{max-width:1600px;margin:auto;padding:20px 40px;border-bottom:1px solid var(--line);min-height:80px;display:flex;align-items:center;justify-content:space-between;gap:24px;position:sticky;top:0;z-index:10;background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:16px;letter-spacing:.08em}.brand strong{font-family:"TisyaReading","Noto Serif SC","Songti SC",serif;font-size:21px;font-weight:650}.brand span{color:var(--muted);font-size:13px}
.top-actions{display:flex;align-items:center;gap:8px}.quiet{min-width:44px;min-height:44px;padding:9px 12px;color:var(--muted);border-radius:3px;transition:background-color .16s ease-out,color .16s ease-out}.quiet:hover{background:var(--soft);color:var(--ink)}.exit-atlas{border:1px solid var(--line);color:var(--ink)}
.shell{max-width:1600px;margin:auto;display:grid;grid-template-columns:144px minmax(0,1fr);min-height:calc(100dvh - 132px)}
.navigation{display:flex;flex-direction:column;gap:4px;padding:40px 20px;border-right:1px solid var(--line)}
.navigation button{display:flex;align-items:center;text-align:left;padding:12px 14px;min-height:48px;border-left:2px solid transparent;color:var(--muted);transition:color .16s ease-out,background-color .16s ease-out,border-color .16s ease-out}
.navigation button:hover{color:var(--ink);background:var(--soft)}.navigation button.active{color:var(--accent);border-left-color:var(--accent);background:var(--soft);font-weight:650}
.content{padding:40px 48px 64px;min-width:0;overflow-wrap:anywhere}.content-atlas,.content-timeline{max-width:1320px}
.heading{margin-bottom:32px;max-width:760px}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.12em;margin:0 0 10px}.heading h1,.collection-heading h1{font-family:"TisyaReading","Noto Serif SC","Songti SC",serif;font-size:40px;line-height:1.2;letter-spacing:.04em;font-weight:600;margin:0 0 14px}.lede{color:var(--muted);font-size:16px;line-height:1.75;margin:0;max-width:68ch}
.collection-heading{margin-bottom:36px;max-width:780px}.collection-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:48px;align-items:start}.archive-sidebar{position:sticky;top:104px;min-width:0}.archive-sidebar label,.sidebar-label{display:block;font-size:13px;font-weight:650;letter-spacing:.05em;margin:0 0 10px}.sidebar-label{margin-top:28px}
.searchbar{display:flex;align-items:center;gap:8px}.searchbar input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink);padding:10px 12px;font-size:15px}.searchbar input::placeholder{color:var(--muted)}
.scopebar{display:flex;gap:8px;margin-top:16px}.scopebar select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink);padding:8px 10px}.scopebar .quiet{border:1px solid var(--line)}
.filters{display:flex;flex-direction:column;border-top:1px solid var(--line)}.filters button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:46px;padding:10px 4px;text-align:left;border-bottom:1px solid var(--line);color:var(--muted);transition:color .16s ease-out,padding-left .16s ease-out}.filters button:hover{color:var(--ink);padding-left:8px}.filters button.selected{color:var(--accent);font-weight:650}.filter-count{font-variant-numeric:tabular-nums;font-size:13px}
.archive-results{min-width:0}.results-toolbar{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);margin-bottom:4px}.result-count{margin:0;color:var(--muted);font-size:14px}.view-switch{display:flex;gap:4px}.view-switch button{min-width:52px;min-height:44px;padding:6px 10px;color:var(--muted);border-bottom:2px solid transparent}.view-switch button.selected{color:var(--accent);border-bottom-color:var(--accent)}
.card-grid.list{display:block}.archive-card{position:relative;display:flex;align-items:center;gap:24px;width:100%;padding:24px 12px;text-align:left;border-bottom:1px solid var(--line);border-radius:0;transition:background-color .18s ease-out,transform .18s ease-out}.archive-card:hover{background:var(--soft);transform:translateX(2px)}.archive-card:active{transform:translateX(0)}.archive-card-content{display:block;min-width:0;flex:1}.card-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px}.type{font-size:12px;color:var(--accent);font-weight:650;letter-spacing:.06em}.card-context{font-size:12px;color:var(--muted);text-align:right}.archive-card h2{font-family:"TisyaReading","Noto Serif SC","Songti SC",serif;font-size:23px;line-height:1.35;font-weight:600;margin:0 0 8px}.card-summary{color:var(--muted);font-size:15px;line-height:1.7;margin:0;max-width:68ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card-action{display:block;margin-top:12px;font-size:13px;color:var(--accent)}
.archive-card-image-frame{flex:0 0 112px;width:112px;height:132px;margin:0;overflow:hidden;background:var(--soft)}.archive-card-image{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .2s ease-out}.image-unavailable{display:grid;place-items:center;height:100%;padding:8px;color:var(--muted);font-size:12px;text-align:center}
.card-grid.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}.card-grid.grid .archive-card{display:block;background:var(--bg);border:0;padding:24px;height:100%}.card-grid.grid .archive-card:hover{background:var(--soft);transform:none}.card-grid.grid .archive-card-image-frame{width:100%;height:auto;aspect-ratio:4/3;margin-bottom:20px}.card-grid.grid .card-top{align-items:flex-start}.card-grid.grid .card-context{max-width:50%}
.empty{padding:32px 0;color:var(--muted);max-width:65ch}.empty-search{padding:48px 16px;border-bottom:1px solid var(--line)}.empty-search h2{color:var(--ink);font-size:22px;margin:0 0 8px}.empty-search p{margin:0 0 20px}.secondary,.primary,.text-link{min-height:44px;padding:9px 14px;border:1px solid var(--line);border-radius:3px;color:var(--accent);transition:background-color .16s ease-out}.secondary:hover,.primary:hover,.text-link:hover{background:var(--soft)}.primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}.collection-status .muted,.muted{color:var(--muted)}
