      <stop stop-color="#f6f3eb"/><stop offset=".6" stop-color="#eae6de"/><stop offset="1" stop-color="#f7f4ed"/>
    </linearGradient>
    <radialGradient id="sun"><stop stop-color="#fffdf4" stop-opacity=".85"/><stop offset="1" stop-color="#fffdf4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="86" height="86" patternUnits="userSpaceOnUse">
      <path d="M86 0H0v86" stroke="#bdb5a7" stroke-width="1" fill="none" opacity=".14"/>
      <circle cx="27" cy="39" r=".6" fill="#bdb5a7" opacity=".15"/>
