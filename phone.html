  async function receive(raw,requestId){const s=state();const requests=Array.isArray(s.requests)?s.requests:Object.values(s.requests??{});let id=requestId||ui.prepared?.requestId||requests.at(-1)?.requestId||requests.at(-1)?.id;if(!id||typeof id!=='string')throw err('PHONE_REQUEST_REQUIRED','请先整理待发送内容，再接收同一轮的回复。');const result=await service.acceptTurn({chatKey:s.contextKey,sourceId:`preview-reply:${id}`,uid:`preview-reply:${id}`,candidate:`preview-reply:${id}`,raw:String(raw),requestId:id,allowStandalone:true});ui.prepared=null;ui.dialog=null;ui.notice='本轮已处理，新内容已接回对应页面。';render();return result;}
  async function copy(value){try{await win.navigator.clipboard.writeText(value);ui.notice='已复制。';render();}catch{ui.notice='当前环境不能自动复制，内容已选中，可手动复制。';render();const field=root.querySelector?.('[name="phoneModalValue"]');field?.focus();field?.select();}}
  function download(value){const blob=new Blob([value],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=doc.createElement('a');a.href=url;a.download=`tisya-phone-${new Date().toISOString().replace(/[:.]/g,'-')}.json`;doc.body.appendChild(a);a.click();a.remove();timers.setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function latestRequestId(){const r=state().requests,list=Array.isArray(r)?r:Object.values(r??{});return ui.prepared?.requestId??list.at(-1)?.requestId??list.at(-1)?.id??'';}
  const click=e=>{const n=e.target.closest?.('button,[data-open],[data-jump]');if(!n||root.contains?.(n)===false||n.disabled||n.closest?.('[inert]'))return;const d=n.dataset;enqueue(async()=>{if(hasData(n,'phoneNav'))return navigate(d.phoneNav);if(hasData(n,'phoneEmptyKind')){navigate('apps');root.querySelector?.(`[data-phone-kind="${d.phoneEmptyKind}"]`)?.scrollIntoView?.({block:'start'});return;}if(hasData(n,'phoneOpen'))return open(d.phoneOpen);if(hasData(n,'phoneBack')){stopPlayback();const prior=ui.history.pop();if(prior){ui.screen=prior.screen;ui.current=prior.current;}else ui.screen='home';render();return;}if(hasData(n,'phoneClose')){if(host?.close)host.close();else{ui.notice='独立预览可直接关闭页面；进度已保存在此浏览器。';render();}return;}if(hasData(n,'phoneDismissReply')){const v=view(ui.current);v.replyFloor=null;v.replyItem=null;render();return;}if(hasData(n,'phoneReplyItem')){view(ui.current).replyItem=d.phoneReplyItem;view(ui.current).replyFloor=null;render();root.querySelector?.('[name="text"]')?.focus();return;}if(hasData(n,'phoneReactValue')){const target=hasData(n,'phoneReactFloor')?{floor:Number(d.phoneReactFloor)}:hasData(n,'phoneReactItem')?{itemId:d.phoneReactItem}:{};return react(d.phoneReactThread,target,d.phoneReactValue);}if(hasData(n,'phoneCancel')){await service.cancelAction(d.phoneCancel);ui.notice='已撤回待发动作。';render();return;}if(hasData(n,'phoneRetry')){if(typeof service.retryAction!=='function')throw err('PHONE_RETRY_UNAVAILABLE','这条动作暂不能直接重试，请查看原消息后重新发送。');await service.retryAction(d.phoneRetry);render();return;}if(hasData(n,'phoneSearchMore'))return search(ui.query,ui.searchScope,{queue:true});if(hasData(n,'phoneCopyPrompt'))return prepare();if(hasData(n,'phoneFailPreview')){if(!win?.confirm||!win.confirm('请确认主聊天上一轮生成已经结束。恢复只会把尚未处理的动作重新排队，保留原消息，不会自动调用模型。继续吗？'))return;if(host){if(typeof host.recoverPending!=='function')throw err('PHONE_RECOVER_UNAVAILABLE','当前宿主还没有提供待发恢复入口。');await host.recoverPending({confirmedEnded:true});}else{const pending=Object.values(state().requests??{}).find(r=>r.status==='prepared');if(!pending)throw err('PHONE_NO_PENDING_TURN','当前没有等待接收的回合。');await service.failTurn({requestId:pending.requestId,error:'本轮未完成，原待发内容已保留'});}ui.prepared=null;ui.notice='未处理的动作已恢复待发，原消息仍保留。';render();return;}if(hasData(n,'phoneSync')){ui.dialog={kind:'sync',title:'接收本轮内容',note:'粘贴这一轮完整回复，或预览用的扩展 JSON。',value:'',requestId:latestRequestId()};render();return;}if(hasData(n,'phoneModalClose')){ui.dialog=null;render();return;}if(hasData(n,'phoneModalCopy'))return copy(ui.dialog?.value??'');if(hasData(n,'phoneModalApply')){const raw=root.querySelector?.('[name="phoneModalValue"]')?.value??'',requestId=root.querySelector?.('[name="phoneRequestId"]')?.value??'';ui.dialog.value=raw;ui.dialog.requestId=requestId;return receive(raw,requestId);}if(hasData(n,'phoneExport'))return download(await service.export());if(hasData(n,'phoneNotification')){const notice=(state().notifications??[]).find(x=>x.id===d.phoneNotification);if(!notice)throw err('PHONE_NOTIFICATION_MISSING','通知已不存在。');await service.readNotification(notice.id);return open(notice.threadId);}if(hasData(n,'open')){if(d.notification){const inbox=getDoc(state().suite,'inbox-main','me');if(inbox)await service.applyLocal({blocks:[{type:'inbox',thread:inbox.id,meta:{unreadIds:(inbox.meta.unreadIds??[]).filter(x=>x!==d.notification)}}]});}return open(d.open,{fromContent:true});}if(hasData(n,'action'))return action(d.action,d.record??ui.current,d.value??'');if(hasData(n,'jump'))return jump(Number(d.jump));if(hasData(n,'replyFloor')){view(ui.current).replyFloor=Number(d.replyFloor);view(ui.current).replyItem=null;render();root.querySelector?.('[name="text"]')?.focus();return;}if(hasData(n,'likeFloor'))return react(ui.current,{floor:Number(d.likeFloor)},'like');});};
  const submit=e=>{if(e.target.matches?.('[data-phone-send]')){e.preventDefault();const value=e.target.querySelector('[name="text"]').value;enqueue(()=>send(value));}else if(e.target.matches?.('[data-phone-search]')){e.preventDefault();const query=e.target.querySelector('[name="query"]').value,scope=e.target.querySelector('[name="scope"]').value;enqueue(()=>search(query,scope));}};
  const input=e=>{if(e.target.matches?.('[data-phone-send] [name="text"]')){const id=ui.current,value=e.target.value;ui.drafts[id]=value;draftQueue=draftQueue.then(()=>service.setDraft(id,value)).catch(showError);}else if(e.target.matches?.('[data-public-search]')){const id=e.target.dataset.record;view(id).query=e.target.value;render();}else if(e.target.name==='phoneModalValue'&&ui.dialog)ui.dialog.value=e.target.value;else if(e.target.name==='phoneRequestId'&&ui.dialog)ui.dialog.requestId=e.target.value;};
  const change=e=>{if(e.target.matches?.('[data-phone-import]')){const file=e.target.files?.[0];if(!file)return;enqueue(async()=>{const raw=await file.text();if(win?.confirm&&!win.confirm('导入会替换这部手机当前的进度。已需要保留的内容请先导出，继续导入吗？'))return;await service.import(raw);ui.notice='已导入进度。';render();});}else if(e.target.matches?.('[data-media-seek]'))enqueue(()=>action('play',e.target.dataset.mediaSeek,`seek:${e.target.value}`));else if(e.target.matches?.('[data-floor-assist]')){view(ui.current).floorAssist=e.target.checked;render();}};
  const visibility=()=>{if(doc?.hidden){stopPlayback();render();}};
  root.addEventListener('click',click);root.addEventListener('submit',submit);root.addEventListener('input',input);root.addEventListener('change',change);doc?.addEventListener?.('visibilitychange',visibility);
  const parentWindow=host&&win?.parent?win.parent:null;parentWindow?.addEventListener?.('tisya:phone-change',refresh);const unsubscribe=typeof host?.subscribe==='function'?host.subscribe(refresh):null;
  render();
  function dispose(){if(ui.disposed)return;ui.disposed=true;stopPlayback();root.removeEventListener('click',click);root.removeEventListener('submit',submit);root.removeEventListener('input',input);root.removeEventListener('change',change);doc?.removeEventListener?.('visibilitychange',visibility);parentWindow?.removeEventListener?.('tisya:phone-change',refresh);win?.removeEventListener?.('pagehide',dispose);if(typeof unsubscribe==='function')unsubscribe();}win?.addEventListener?.('pagehide',dispose);return Object.freeze({refresh,open,navigate,send,react,search,prepare,receive,action,jump,settled:async()=>{await Promise.all([taskQueue,draftQueue]);await service.settled?.();},inspect:()=>({screen:ui.screen,current:ui.current,notice:ui.notice,query:ui.query,searchScope:ui.searchScope,dialog:ui.dialog?.kind??null}),dispose});
}

async function bootPhone({win=globalThis.window,doc=globalThis.document,root=null}={}){
  root??=doc.getElementById('phone-root')??doc.getElementById('app');if(!root){root=doc.createElement('div');root.id='phone-root';doc.body.appendChild(root);}
  let host=null,app=null;try{const parent=win.parent;if(parent&&parent!==win)host=parent.Tisya?.phone??null;else host=win.Tisya?.phone??null;}catch(e){root.innerHTML=`<p class="phone-start-error">${esc(errorText(err('PHONE_HOST_ACCESS','无法访问所属聊天，未创建替代存档。')))}</p>`;throw e;}
  const params=new URLSearchParams(win.location?.search??'');
  try{const expectedContextKey=params.get('chat');if(host&&(!expectedContextKey||typeof host.contextKey!=='function'||await host.contextKey()!==expectedContextKey))throw err('PHONE_CONTEXT_CHANGED','手机打开时的聊天归属缺失或已变化，请从当前聊天重新打开。');if(params.has('frozen'))return await renderPhoneFrozen({host,root,sourceId:params.get('frozen'),markerId:params.get('marker')??'m1',win,expectedContextKey});let service;if(host){if(typeof host.service!=='function')throw err('PHONE_HOST_INTERFACE','宿主尚未提供手机状态接口。');service=await host.service();}else{if(win.parent!==win)throw err('PHONE_HOST_REQUIRED','所属聊天尚未接入手机服务，未创建替代存档。');service=createPhoneService({seed:phoneSeed,storage:createPhoneLocalStorage(win.localStorage),contextKey:'preview-phone',onChange:()=>app?.refresh()});await service.init();}app=await createPhoneApp({root,service,host,win,doc,initialId:params.get('doc'),expectedContextKey});win.tisyaPhoneApp=app;return app;}catch(e){root.innerHTML=`<section class="phone-start-error" role="alert"><h1>手机暂时无法打开</h1><p>${esc(errorText(e))}</p><p>已有进度没有被重置。处理原因后重新打开。</p></section>`;throw e;}
}

if(typeof window!=='undefined'&&typeof document!=='undefined'&&!window.__TISYA_PHONE_NO_AUTOBOOT__){const start=()=>bootPhone().catch(e=>console.error(e));if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();}

return {phoneSeed,createPhoneLocalStorage,phoneSnapshotBody,renderPhoneFrozen,createPhoneApp,bootPhone};
})();
</script></body></html>
