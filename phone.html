function render(){if(!state)return;const app=APPS.find(a=>a[0]===ui.app);$('#status-time').textContent=clockText();$('#appbar').innerHTML=`${btn(icon(ui.app==='home'?'user':'back'),ui.app==='home'?'nav':'back',ui.app==='home'?{app:'settings'}:{},'icon-button')}<span class="bar-title">${esc((app?appName(app[0],app[1]):null)||({home:'生活手机',inbox:'消息中心',settings:'设置',search:'搜索'}[ui.app]||'生活手机'))}</span>${btn(icon('search'),'search.open',{},'icon-button')}${btn(icon('bell')+(state.social.notifications.filter(n=>n.recipientId===state.social.activeAccountId&&!n.seen).length?`<span class="badge">${state.social.notifications.filter(n=>n.recipientId===state.social.activeAccountId&&!n.seen).length}</span>`:''),'nav',{app:'inbox'},'icon-button')}`;

async function stashDraft(){if(!state||ui.app!=='weibo'||ui.tab!=='compose')return;const form=$('#screen form[data-action="social.publish"]');if(!form)return;const text=form.elements.namedItem('text')?.value??'',visibility=form.elements.namedItem('visibility')?.value??'public';const previous=state.social.drafts?.[state.social.activeAccountId];if(previous?.text===text&&previous?.visibility===visibility){draftDirty=false;return;}await dispatch({type:'social.draft.save',text,visibility},false,{quiet:true});draftDirty=false;}

async function dispatch(action,permitBusy=false,{quiet=false}={}){assertScope();if(!state)throw new Error('请先初始化生活手机。');if(busy&&!permitBusy)throw new Error('上一项操作正在保存，请稍候。');if(['world.advance','order.advance','calendar.confirm','calendar.respond','social.network.advance','social.network.seen'].includes(action.type))throw new Error('该状态由下一轮剧情的实际回执推进。');busy=true;$('#busy').innerHTML='<span class="busy-mark">正在保存</span>';try{action={...action,id:action.id||makeId('op')};const out=await service.dispatchLife(action,{expectedRevision:service.getState().revision,bindingKey});assertScope();updateState();if(!quiet){if(out.result?.navigate)navigate(out.result.navigate);else if(action.type.startsWith('wallet.'))navigate({app:'wallet',tab:'ledger'});else render();toast(out.result?.message||'已保存');}return out.result;}finally{busy=false;if(!disposed)$('#busy').innerHTML='';if(refreshPending&&!disposed){refreshPending=false;refresh();}}}
async function openDb(){assertScope();if(mediaDb)return mediaDb;if(!window.indexedDB)throw new Error('当前宿主没有可用的媒体存储接口；状态和原件均未替换。');mediaDb=await new Promise((resolve,reject)=>{const req=window.indexedDB.open('tisya-phone-host-media',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('assets'))req.result.createObjectStore('assets',{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(new Error('媒体资源库无法打开：'+(req.error?.message||'未知错误')));req.onblocked=()=>reject(new Error('媒体资源库正在被其他页面升级，请稍后重开。'));});assertScope();return mediaDb;}
const assetKey=id=>JSON.stringify([expectedContextKey,bindingKey,id]);
async function assetGet(id){assertScope();const db=await openDb();const blob=await new Promise((resolve,reject)=>{const req=db.transaction('assets','readonly').objectStore('assets').get(assetKey(id));req.onsuccess=()=>resolve(req.result?.blob??null);req.onerror=()=>reject(new Error('媒体原件读取失败。'));});assertScope();return blob;}
async function assetPut(id,blob){assertScope();const old=await assetGet(id);if(old){const a=new Uint8Array(await old.arrayBuffer()),b=new Uint8Array(await blob.arrayBuffer());assertScope();if(a.length!==b.length||a.some((v,i)=>v!==b[i]))throw new Error('媒体编号与已保存原件冲突，原件已保留。');return;}const db=await openDb();assertScope();await new Promise((resolve,reject)=>{const tx=db.transaction('assets','readwrite');tx.objectStore('assets').add({id:assetKey(id),blob});tx.oncomplete=resolve;tx.onerror=()=>reject(new Error('媒体保存失败：'+(tx.error?.message||'存储不可用')));tx.onabort=()=>reject(new Error('媒体保存已中止。'));});assertScope();}
function bindUrl(id,blob){assertScope();if(mediaURLs.has(id))URL.revokeObjectURL(mediaURLs.get(id));mediaURLs.set(id,URL.createObjectURL(blob));}
async function loadMediaURLs(){if(!state)return;const ids=[...state.media.photos.filter(p=>p.source==='file').map(p=>p.id),...state.media.songs.map(s=>s.audioId).filter(Boolean)];if(!ids.length)return;try{for(const id of new Set(ids)){const blob=await assetGet(id);if(blob)bindUrl(id,blob);}render();}catch(e){toast(e.message,true);}}
const getSong=id=>state?.media.songs.find(s=>s.id===id);
async function play(id){assertScope();const song=getSong(id);if(!song)throw new Error('歌曲不存在。');let url=mediaURLs.get(song.audioId);if(!url&&song.audioId){const blob=await assetGet(song.audioId);if(blob){bindUrl(song.audioId,blob);url=mediaURLs.get(song.audioId);}}if(!url)throw new Error('这首歌还没有可用音源。请先导入音频文件。');if(currentSongId!==id){audio.pause();currentSongId=id;audio.src=url;}try{await audio.play();}catch(e){throw new Error(`无法播放该音源：${e.message}`);}updatePlayer();}
function updatePlayer(){const song=getSong(currentSongId),el=$('#mini-player');if(!song){el.className='mini-player';return;}el.className='mini-player visible';const duration=Number.isFinite(audio.duration)?audio.duration:0;if(el.dataset.song!==song.id){el.dataset.song=song.id;el.innerHTML=`<div class="mini-cover">${art(song.cover||'album')}</div><div class="mini-details"><strong>${esc(song.title)}</strong><span data-player-time></span><input type="range" min="0" max="100" step="0.1" value="0" aria-label="播放进度" data-player-seek></div>${btn(icon('play'),'player.play',{songId:currentSongId},'icon-button player-toggle')}${btn(icon('more'),'player.controls',{},'icon-button')}`;}el.querySelector('[data-player-time]').textContent=`${song.artist} · ${formatDuration(audio.currentTime)} / ${duration?formatDuration(duration):'载入中'}`;const seek=el.querySelector('[data-player-seek]');seek.disabled=!duration;seek.value=duration?Math.min(100,audio.currentTime/duration*100):0;const toggle=el.querySelector('.player-toggle');toggle.dataset.action=audio.paused?'player.play':'player.pause';toggle.innerHTML=icon(audio.paused?'play':'pause');}
const formatDuration=s=>`${Math.floor((s||0)/60)}:${String(Math.floor((s||0)%60)).padStart(2,'0')}`;
function audioList(){return state.media.songs.filter(s=>s.audioId&&mediaURLs.has(s.audioId));}
async function nextSong(step=1){const songs=audioList();if(!songs.length)return;const i=songs.findIndex(s=>s.id===currentSongId);let n=(i+step+songs.length)%songs.length;if(playbackMode==='shuffle'&&songs.length>1){n=(i+1+Math.floor(Math.random()*(songs.length-1)))%songs.length;}await play(songs[n].id);}
listen(audio,'timeupdate',updatePlayer);listen(audio,'loadedmetadata',updatePlayer);listen(audio,'pause',updatePlayer);listen(audio,'ended',()=>nextSong().catch(e=>toast(e.message,true)));listen(audio,'error',()=>toast(`音源无法播放，原文件与歌单已保留。${audio.error?.message||''}`,true));
async function handle(type,p={}){if(busy&&!['player.pause','player.controls'].includes(type))throw new Error('正在保存或导入，完成后再操作。');if(type==='host.network'){await stashDraft();return onBack?.();}if(type==='host.identity'){await stashDraft();return host.openIdentity?.();}if(type==='nav'){await stashDraft();navigate(p);return;}if(type==='ui'){await stashDraft();ui={...ui,...p};render();return;}if(type==='back'){await stashDraft();back();return;}if(type==='modal.close'){$('#overlay').innerHTML='';return;}if(type==='search.open'){await stashDraft();navigate({app:'search'});return;}if(type==='search.submit'){ui.query=p.query;render();return;}if(type==='file.image'){$('#image-input').click();return;}if(type==='file.audio'){pendingAudioTarget=p.songId||null;$('#audio-input').click();return;}if(type==='player.play'){await play(p.songId||currentSongId);return;}if(type==='player.pause'){audio.pause();return;}if(type==='player.previous'){await nextSong(-1);return;}if(type==='player.mode'){playbackMode=p.mode;audio.loop=playbackMode==='one';toast('已切换播放方式');return;}if(type==='player.controls'){const song=getSong(currentSongId);openSheet(`<h2>${esc(song?.title||'播放器')}</h2><div class="row">${btn('上一首','player.previous')}${btn(audio.paused?'播放':'暂停',audio.paused?'player.play':'player.pause',{songId:currentSongId})}${btn('下一首','player.next')}</div><label class="field" style="margin-top:20px">音量<input type="range" min="0" max="1" step="0.05" value="${audio.volume}" data-player-volume></label><div class="row">${btn('顺序循环','player.mode',{mode:'all'})}${btn('单曲循环','player.mode',{mode:'one'})}${btn('随机','player.mode',{mode:'shuffle'})}</div>`);return;}if(type==='player.next'){await nextSong();return;}if(type==='backup.errors'){download(JSON.stringify({exportedAt:new Date().toISOString(),errors:runtimeErrors},null,2),'缇斯亚-手机运行记录.json','application/json');return;}if(type==='backup.raw'){download(currentRaw||'未读取到原存档','缇斯亚-原始存档.txt','text/plain');return;}if(type==='backup.export'){await expo function parseForm(form){const data={...JSON.parse(form.dataset.payload||'{}')};for(const [key,value] of new window.FormData(form)){const el=form.elements.namedItem(key);if(el?.dataset?.cents!==undefined){const text=String(value).trim();if(!/^\d+(\.\d{1,2})?$/.test(text))throw new Error('金额最多填写两位小数。');const [a,b='']=text.split('.');data[key]=Number(a)*100+Number(b.padEnd(2,'0'));if(!Number.isSafeInteger(data[key]))throw new Error('金额超出可处理范围。');}else if(el?.dataset?.minutes!==undefined){if(!/^\d{2}:\d{2}$/.test(value))throw new Error('请填写有效时间。');const [h,m]=value.split(':').map(Number);if(h>23||m>59)throw new Error('时间超出一天范围。');data[key]=h*60+m;}else if(el?.type==='number'||el?.dataset?.number!==undefined){data[key]=Number(value);if(!Number.isFinite(data[key]))throw new Error('请填写有效数字。');}else data[key]=value;}return data;}
listen(surface,'click',e=>{const el=e.target.closest('button[data-action]');if(!el||el.disabled)return;e.preventDefault();try{const p=JSON.parse(el.dataset.payload||'{}');Promise.resolve(handle(el.dataset.action,p)).catch(err=>toast(err.message,true));}catch(err){toast(err.message,true);}});

listen($('#image-input'),'change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;const owner=state?.social.activeAccountId??state?.config?.subjectId;if(busy){toast('上一项操作仍在进行，请稍后重新选择文件。',true);return;}busy=true;try{if(!file.type.startsWith('image/'))throw new Error('请选择图片文件。');if(file.size>64*1024*1024)throw new Error('单个媒体文件超过64MB，请选择较小的版本。');const id=makeId('photo');await assetPut(id,file);bindUrl(id,file);await dispatch({type:'media.photo.add',photo:{id,name:file.name,mime:file.type,source:'file',ownerId:owner,visibility:'private'}},true);navigate({app:'album'});}catch(err){toast(err.message,true);}finally{busy=false;}});

  async function receive(raw,requestId){const s=state();const requests=Array.isArray(s.requests)?s.requests:Object.values(s.requests??{});let id=requestId||ui.prepared?.requestId||requests.at(-1)?.requestId||requests.at(-1)?.id;if(!id||typeof id!=='string')throw err('PHONE_REQUEST_REQUIRED','请先整理待发送内容，再接收同一轮的回复。');const result=await service.acceptTurn({chatKey:s.contextKey,sourceId:`preview-reply:${id}`,uid:`preview-reply:${id}`,candidate:`preview-reply:${id}`,raw:String(raw),requestId:id,allowStandalone:true});ui.prepared=null;ui.dialog=null;ui.notice='本轮已处理，新内容已接回对应页面。';render();return result;}
  async function copy(value){try{await win.navigator.clipboard.writeText(value);ui.notice='已复制。';render();}catch{ui.notice='当前环境不能自动复制，内容已选中，可手动复制。';render();const field=root.querySelector?.('[name="phoneModalValue"]');field?.focus();field?.select();}}
  function download(value){const blob=new Blob([value],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=doc.createElement('a');a.href=url;a.download=`tisya-phone-${new Date().toISOString().replace(/[:.]/g,'-')}.json`;doc.body.appendChild(a);a.click();a.remove();timers.setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function latestRequestId(){const r=state().requests,list=Array.isArray(r)?r:Object.values(r??{});return ui.prepared?.requestId??list.at(-1)?.requestId??list.at(-1)?.id??'';}
  const click=e=>{const n=e.target.closest?.('button,[data-open],[data-jump]');if(!n||root.contains?.(n)===false||n.disabled||n.closest?.('[inert]'))return;const d=n.dataset;enqueue(async()=>{if(hasData(n,'phoneLife')){if(!host?.open)throw err('PHONE_HOST_REQUIRED','请从聊天中的桌宠手机打开生活应用。');return host.open({appId:'home'});}if(hasData(n,'phoneNav'))return navigate(d.phoneNav);if(hasData(n,'phoneEmptyKind')){navigate('apps');root.querySelector?.(`[data-phone-kind="${d.phoneEmptyKind}"]`)?.scrollIntoView?.({block:'start'});return;}if(hasData(n,'phoneOpen'))return open(d.phoneOpen);if(hasData(n,'phoneBack')){stopPlayback();const prior=ui.history.pop();if(prior){ui.screen=prior.screen;ui.current=prior.current;}else ui.screen='home';render();return;}if(hasData(n,'phoneClose')){if(host?.close)host.close();else{ui.notice='独立预览可直接关闭页面；进度已保存在此浏览器。';render();}return;}if(hasData(n,'phoneDismissReply')){const v=view(ui.current);v.replyFloor=null;v.replyItem=null;render();return;}if(hasData(n,'phoneReplyItem')){view(ui.current).replyItem=d.phoneReplyItem;view(ui.current).replyFloor=null;render();root.querySelector?.('[name="text"]')?.focus();return;}if(hasData(n,'phoneReactValue')){const target=hasData(n,'phoneReactFloor')?{floor:Number(d.phoneReactFloor)}:hasData(n,'phoneReactItem')?{itemId:d.phoneReactItem}:{};return react(d.phoneReactThread,target,d.phoneReactValue);}if(hasData(n,'phoneCancel')){await service.cancelAction(d.phoneCancel);ui.notice='已撤回待发动作。';render();return;}if(hasData(n,'phoneRetry')){if(typeof service.retryAction!=='function')throw err('PHONE_RETRY_UNAVAILABLE','这条动作暂不能直接重试，请查看原消息后重新发送。');await service.retryAction(d.phoneRetry);render();return;}if(hasData(n,'phoneSearchMore'))return search(ui.query,ui.searchScope,{queue:true});if(hasData(n,'phoneCopyPrompt'))return prepare();if(hasData(n,'phoneFailPreview')){if(!win?.confirm||!win.confirm('请确认主聊天上一轮生成已经结束。恢复只会把尚未处理的动作重新排队，保留原消息，不会自动调用模型。继续吗？'))return;if(host){if(typeof host.recoverPending!=='function')throw err('PHONE_RECOVER_UNAVAILABLE','当前宿主还没有提供待发恢复入口。');await host.recoverPending({confirmedEnded:true});}else{const pending=Object.values(state().requests??{}).find(r=>r.status==='prepared');if(!pending)throw err('PHONE_NO_PENDING_TURN','当前没有等待接收的回合。');await service.failTurn({requestId:pending.requestId,error:'本轮未完成，原待发内容已保留'});}ui.prepared=null;ui.notice='未处理的动作已恢复待发，原消息仍保留。';render();return;}if(hasData(n,'phoneSync')){ui.dialog={kind:'sync',title:'接收本轮内容',note:'粘贴这一轮完整回复，或预览用的扩展 JSON。',value:'',requestId:latestRequestId()};render();return;}if(hasData(n,'phoneModalClose')){ui.dialog=null;render();return;}if(hasData(n,'phoneModalCopy'))return copy(ui.dialog?.value??'');if(hasData(n,'phoneModalApply')){const raw=root.querySelector?.('[name="phoneModalValue"]')?.value??'',requestId=root.querySelector?.('[name="phoneRequestId"]')?.value??'';ui.dialog.value=raw;ui.dialog.requestId=requestId;return receive(raw,requestId);}if(hasData(n,'phoneExport'))return download(await service.export());if(hasData(n,'phoneNotification')){const notice=(state().notifications??[]).find(x=>x.id===d.phoneNotification);if(!notice)throw err('PHONE_NOTIFICATION_MISSING','通知已不存在。');await service.readNotification(notice.id);return open(notice.threadId);}if(hasData(n,'open')){if(d.notification){const inbox=getDoc(state().suite,'inbox-main','me');if(inbox)await service.applyLocal({blocks:[{type:'inbox',thread:inbox.id,meta:{unreadIds:(inbox.meta.unreadIds??[]).filter(x=>x!==d.notification)}}]});}return open(d.open,{fromContent:true});}if(hasData(n,'action'))return action(d.action,d.record??ui.current,d.value??'');if(hasData(n,'jump'))return jump(Number(d.jump));if(hasData(n,'replyFloor')){view(ui.current).replyFloor=Number(d.replyFloor);view(ui.current).replyItem=null;render();root.querySelector?.('[name="text"]')?.focus();return;}if(hasData(n,'likeFloor'))return react(ui.current,{floor:Number(d.likeFloor)},'like');});};
  const submit=e=>{if(e.target.matches?.('[data-phone-send]')){e.preventDefault();const value=e.target.querySelector('[name="text"]').value;enqueue(()=>send(value));}else if(e.target.matches?.('[data-phone-search]')){e.preventDefault();const query=e.target.querySelector('[name="query"]').value,scope=e.target.querySelector('[name="scope"]').value;enqueue(()=>search(query,scope));}};
  const input=e=>{if(e.target.matches?.('[data-phone-send] [name="text"]')){const id=ui.current,value=e.target.value;ui.drafts[id]=value;draftQueue=draftQueue.then(()=>service.setDraft(id,value)).catch(showError);}else if(e.target.matches?.('[data-public-search]')){const id=e.target.dataset.record;view(id).query=e.target.value;render();}else if(e.target.name==='phoneModalValue'&&ui.dialog)ui.dialog.value=e.target.value;else if(e.target.name==='phoneRequestId'&&ui.dialog)ui.dialog.requestId=e.target.value;};
  const change=e=>{if(e.target.matches?.('[data-phone-import]')){const file=e.target.files?.[0];if(!file)return;enqueue(async()=>{const raw=await file.text();if(win?.confirm&&!win.confirm('导入会替换这部手机当前的进度。已需要保留的内容请先导出，继续导入吗？'))return;await service.import(raw);ui.notice='已导入进度。';render();});}else if(e.target.matches?.('[data-media-seek]'))enqueue(()=>action('play',e.target.dataset.mediaSeek,`seek:${e.target.value}`));else if(e.target.matches?.('[data-floor-assist]')){view(ui.current).floorAssist=e.target.checked;render();}};
  const visibility=()=>{if(doc?.hidden){stopPlayback();render();}};
  root.addEventListener('click',click);root.addEventListener('submit',submit);root.addEventListener('input',input);root.addEventListener('change',change);doc?.addEventListener?.('visibilitychange',visibility);
  const parentWindow=host&&win?.parent?win.parent:null;parentWindow?.addEventListener?.('tisya:phone-change',refresh);const unsubscribe=typeof host?.subscribe==='function'?host.subscribe(refresh):null;
  render();
  function dispose(){if(ui.disposed)return;ui.disposed=true;stopPlayback();root.removeEventListener('click',click);root.removeEventListener('submit',submit);root.removeEventListener('input',input);root.removeEventListener('change',change);doc?.removeEventListener?.('visibilitychange',visibility);parentWindow?.removeEventListener?.('tisya:phone-change',refresh);win?.removeEventListener?.('pagehide',dispose);if(typeof unsubscribe==='function')unsubscribe();}win?.addEventListener?.('pagehide',dispose);return Object.freeze({refresh,open,navigate,send,react,search,prepare,receive,action,jump,settled:async()=>{await Promise.all([taskQueue,draftQueue]);await service.settled?.();},inspect:()=>({screen:ui.screen,current:ui.current,notice:ui.notice,query:ui.query,searchScope:ui.searchScope,dialog:ui.dialog?.kind??null}),dispose});
}

async function bootPhone({win=globalThis.window,doc=globalThis.document,root=null}={}){
  root??=doc.getElementById('phone-root')??doc.getElementById('app');if(!root){root=doc.createElement('div');root.id='phone-root';doc.body.appendChild(root);}
  let host=null,app=null;try{const parent=win.parent;if(parent&&parent!==win)host=parent.Tisya?.phone??null;else host=win.Tisya?.phone??null;}catch(e){root.innerHTML=`<p class="phone-start-error">${esc(errorText(err('PHONE_HOST_ACCESS','无法访问所属聊天，未创建替代存档。')))}</p>`;throw e;}
  const params=new URLSearchParams(win.location?.search??'');
  try{const expectedContextKey=params.get('chat');if(host&&(!expectedContextKey||typeof host.contextKey!=='function'||await host.contextKey()!==expectedContextKey))throw err('PHONE_CONTEXT_CHANGED','手机打开时的聊天归属缺失或已变化，请从当前聊天重新打开。');if(params.has('frozen'))return await renderPhoneFrozen({host,root,sourceId:params.get('frozen'),markerId:params.get('marker')??'m1',win,expectedContextKey});let service;if(host){if(typeof host.service!=='function')throw err('PHONE_HOST_INTERFACE','宿主尚未提供手机状态接口。');service=await host.service();}else{if(win.parent!==win)throw err('PHONE_HOST_REQUIRED','所属聊天尚未接入手机服务，未创建替代存档。');service=createPhoneService({seed:phoneSeed,storage:createPhoneLocalStorage(win.localStorage),contextKey:'preview-phone',onChange:()=>app?.refresh()});await service.init();}if(params.has('app')){if(!host)throw err('PHONE_HOST_REQUIRED','生活手机需要所属聊天的世界与角色配置。');const route=params.get('doc')?service.lifeRouteForDocument?.(params.get('doc')):null;app=await mountPhoneLife({root,service,host,win,doc,initialApp:params.get('app')||'home',expectedContextKey,onBack:()=>host.open({})});if(route?.detail)app.navigate({app:route.appId,tab:'detail',detail:route.detail},{replace:true});}else app=await createPhoneApp({root,service,host,win,doc,initialId:params.get('doc'),expectedContextKey});win.tisyaPhoneApp=app;return app;}catch(e){root.innerHTML=`<section class="phone-start-error" role="alert"><h1>手机暂时无法打开</h1><p>${esc(errorText(e))}</p><p>已有进度没有被重置。处理原因后重新打开。</p></section>`;throw e;}
}

if(typeof window!=='undefined'&&typeof document!=='undefined'&&!window.__TISYA_PHONE_NO_AUTOBOOT__){const start=()=>bootPhone().catch(e=>console.error(e));if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();}

return {phoneSeed,createPhoneLocalStorage,phoneSnapshotBody,renderPhoneFrozen,createPhoneApp,bootPhone};
})();
</script></body></html>
